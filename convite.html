<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criador de Convites - PlanNexus</title>
    <link rel="icon" href="fotos/logo.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Chewy&family=Baloo+2:wght@600&family=Montserrat:wght@500;700&family=Playfair+Display:wght@600;700&family=Allura&family=Great+Vibes&family=Dancing+Script:wght@600&family=Lobster&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/convite.css">

    <!-- PWA: manifest, cor do tema e service worker -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5A32D3">
    <script src="js/pwa.js" defer></script>
</head>

<body>

    <div class="app">

        <header>
            <a class="voltar" id="voltar" href="inicio.html" title="Voltar">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1>Convite</h1>
        </header>

        <main>

            <!-- NOME DO EVENTO -->
            <div class="evento">
                <span>Evento</span>
                <h2 id="nomeEvento">Carregando...</h2>
            </div>

            <!-- TELA 1: LISTA DE MODELOS (por tipo de evento) -->
            <div id="telaModelos">
                <p class="dica-modelos">Escolha um modelo de convite. Depois você ajusta os textos.</p>
                <div id="listaModelos"></div>
            </div>

            <!-- TELA 2: MODELO COM DESIGN (pré-visualização + textos) -->
            <div id="telaModelo" hidden>
                <div class="previa-convite previa-fixa">
                    <canvas id="canvasModelo" width="1600" height="1135" aria-label="Prévia do convite"></canvas>
                </div>

                <section class="bloco">
                    <h3>Textos do convite</h3>
                    <p class="dica-campos">Preenchemos com os dados do evento. Você pode trocar qualquer texto e escolher a fonte dele. O restante do desenho é fixo.</p>
                    <div id="camposModelo"></div>
                </section>
            </div>

            <!-- AÇÕES -->
            <div class="acoes" id="blocoAcoes" hidden>
                <button type="button" class="botao-principal" id="botaoBaixar">
                    <i class="fa-solid fa-download"></i>
                    Baixar imagem
                </button>
                <button type="button" class="botao-secundario" id="botaoCompartilhar">
                    <i class="fa-solid fa-share-nodes"></i>
                    Compartilhar
                </button>
            </div>
            <button type="button" class="botao-trocar" id="botaoTrocar" hidden>Escolher outro modelo</button>
            <p class="mensagem" id="mensagem" role="status"></p>

        </main>

    </div>


    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        import {
            MODELOS, FONTES, modeloPorId, dadosDoEvento, valorAutomatico, valoresIniciais, desenharModelo
        } from "./js/convitesModelos.js";

        // FIREBASE_CONFIG vem do arquivo js/config.js
        const app  = initializeApp(FIREBASE_CONFIG);
        const auth = getAuth(app);
        const db   = getFirestore(app);

        const eventoId = pegarIdDaUrl();

        const mensagem = document.getElementById("mensagem");

        let nomeArquivo = "convite";
        let nomeDoEvento = "";

        // ---- telas: "lista" (modelos) ou "modelo" (design escolhido) ----
        let tela = "lista";
        let categoriaDoEvento = "";
        let dadosEvento = null;          // dados do evento usados no preenchimento automático
        let modeloAtual = null;
        let valoresModelo = {};
        let fontesModelo = {};
        const canvasModelo = document.getElementById("canvasModelo");


        // ================= MODELOS COM DESIGN =================

        function slug(texto) {
            return String(texto || "evento").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "evento";
        }

        function canvasAtivo() {
            return canvasModelo;
        }

        // desenha o modelo aberto (garante que as fontes já carregaram)
        async function desenharAtual() {
            if (modeloAtual) await desenharModelo(canvasModelo, modeloAtual, valoresModelo, fontesModelo, 1600);
        }

        let modeloAgendado = false;
        function agendarModelo() {
            if (modeloAgendado) return;
            modeloAgendado = true;
            requestAnimationFrame(() => {
                modeloAgendado = false;
                if (tela === "modelo" && modeloAtual) desenharModelo(canvasModelo, modeloAtual, valoresModelo, fontesModelo, 1600);
            });
        }

        function mostrarTela(nova) {
            tela = nova;
            document.getElementById("telaModelos").hidden = nova !== "lista";
            document.getElementById("telaModelo").hidden  = nova !== "modelo";
            document.getElementById("blocoAcoes").hidden  = nova === "lista";
            document.getElementById("botaoTrocar").hidden = nova === "lista";
            avisar("");
            window.scrollTo(0, 0);
        }

        function montarListaModelos() {
            const lista = document.getElementById("listaModelos");
            lista.innerHTML = "";

            const grupos = [];
            MODELOS.forEach((m) => {
                let g = grupos.find((x) => x.nome === m.grupo);
                if (!g) { g = { nome: m.grupo, categoria: m.categoria, itens: [] }; grupos.push(g); }
                g.itens.push(m);
            });

            // o grupo do tipo do evento vem primeiro
            grupos.sort((a, b) => (b.categoria === categoriaDoEvento) - (a.categoria === categoriaDoEvento));

            grupos.forEach((g) => {
                const titulo = document.createElement("h3");
                titulo.className = "grupo-modelos";
                titulo.textContent = g.nome;
                if (g.categoria === categoriaDoEvento) {
                    const tag = document.createElement("span");
                    tag.className = "tag-sugerido";
                    tag.textContent = "Sugerido para o seu evento";
                    titulo.appendChild(tag);
                }
                lista.appendChild(titulo);

                const grade = document.createElement("div");
                grade.className = "grade-modelos";

                g.itens.forEach((m) => {
                    const botao = document.createElement("button");
                    botao.type = "button";
                    botao.className = "card-modelo";

                    const mini = document.createElement("canvas");
                    const nome = document.createElement("span");
                    nome.textContent = m.nome;
                    botao.append(mini, nome);
                    botao.addEventListener("click", () => abrirModelo(m.id));
                    grade.appendChild(botao);

                    if (dadosEvento) {
                        const ini = valoresIniciais(m, dadosEvento);
                        desenharModelo(mini, m, ini.valores, ini.fontes, 520);
                    }
                });

                lista.appendChild(grade);
            });

            const aviso = document.createElement("p");
            aviso.className = "aviso-modelos";
            aviso.textContent = "Novos modelos para os outros tipos de evento chegam em breve.";
            lista.appendChild(aviso);
        }

        function abrirModelo(id) {
            modeloAtual = modeloPorId(id);
            if (!modeloAtual) return;

            const ini = valoresIniciais(modeloAtual, dadosEvento || dadosDoEvento({}, ""));
            valoresModelo = ini.valores;
            fontesModelo = ini.fontes;
            nomeArquivo = modeloAtual.arquivo + "-" + slug(nomeDoEvento);

            montarCamposModelo();
            mostrarTela("modelo");
            desenharModelo(canvasModelo, modeloAtual, valoresModelo, fontesModelo, 1600);
        }

        function montarCamposModelo() {
            const area = document.getElementById("camposModelo");
            area.innerHTML = "";
            const dados = dadosEvento || dadosDoEvento({}, "");

            modeloAtual.campos.forEach((campo) => {
                const caixa = document.createElement("div");
                caixa.className = "campo-modelo";

                const rotulo = document.createElement("label");
                rotulo.htmlFor = "cm_" + campo.c;
                const nome = document.createElement("span");
                nome.textContent = campo.rotulo;
                const marcas = document.createElement("span");
                marcas.className = "marcas-campo";
                const tagAuto = document.createElement("span");
                tagAuto.className = "tag-auto";
                tagAuto.textContent = "do evento";
                const refazer = document.createElement("button");
                refazer.type = "button";
                refazer.className = "refazer-campo";
                refazer.textContent = "voltar ao do evento";
                marcas.append(tagAuto, refazer);
                rotulo.append(nome, marcas);

                const linha = document.createElement("div");
                linha.className = "linha-campo";

                const entrada = document.createElement("input");
                entrada.type = "text";
                entrada.id = "cm_" + campo.c;
                entrada.maxLength = 60;
                entrada.value = valoresModelo[campo.c] || "";

                const fonte = document.createElement("select");
                fonte.setAttribute("aria-label", "Fonte: " + campo.rotulo);
                FONTES.forEach((f) => {
                    const o = document.createElement("option");
                    o.value = f.f;
                    o.textContent = f.n;
                    o.selected = f.f === fontesModelo[campo.c];
                    fonte.appendChild(o);
                });

                linha.append(entrada, fonte);
                caixa.append(rotulo, linha);
                area.appendChild(caixa);

                // só campos com preenchimento automático mostram a marca / o botão
                function marcar() {
                    const automatico = campo.auto ? valorAutomatico(campo, dados) : null;
                    const igual = automatico !== null && valoresModelo[campo.c] === automatico;
                    tagAuto.hidden = !(igual && automatico);
                    refazer.hidden = automatico === null || igual;
                }
                marcar();

                entrada.addEventListener("input", () => { valoresModelo[campo.c] = entrada.value; marcar(); agendarModelo(); });
                fonte.addEventListener("change", () => { fontesModelo[campo.c] = fonte.value; agendarModelo(); });
                refazer.addEventListener("click", () => {
                    valoresModelo[campo.c] = valorAutomatico(campo, dados);
                    entrada.value = valoresModelo[campo.c];
                    marcar();
                    agendarModelo();
                });
            });
        }

        document.getElementById("botaoTrocar").addEventListener("click", () => mostrarTela("lista"));

        // a seta do topo volta para a lista de modelos quando você está num modelo
        document.getElementById("voltar").addEventListener("click", (e) => {
            if (tela !== "lista") {
                e.preventDefault();
                mostrarTela("lista");
            }
        });


        // ================= BAIXAR E COMPARTILHAR =================

        function avisar(texto, erro = false) {
            mensagem.textContent = texto;
            mensagem.classList.toggle("erro", erro);
        }

        function gerarImagem() {
            return new Promise((resolve, reject) => {
                canvasAtivo().toBlob((blob) => blob ? resolve(blob) : reject(new Error("Falha ao gerar a imagem.")), "image/png");
            });
        }

        function baixar(blob) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = nomeArquivo + ".png";
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 4000);
        }

        // marca no evento que o convite já foi criado (para o Nexus parar de lembrar)
        function marcarConviteGerado() {
            updateDoc(doc(db, "eventos", eventoId), { conviteGerado: true }).catch(() => {});
        }

        document.getElementById("botaoBaixar").addEventListener("click", async () => {
            try {
                await desenharAtual();
                baixar(await gerarImagem());
                marcarConviteGerado();
                avisar("Imagem salva no seu aparelho.");
            } catch (erro) {
                console.error(erro);
                avisar("Não foi possível gerar a imagem. Tente de novo.", true);
            }
        });

        document.getElementById("botaoCompartilhar").addEventListener("click", async () => {
            try {
                await desenharAtual();

                const blob = await gerarImagem();
                const arquivo = new File([blob], nomeArquivo + ".png", { type: "image/png" });

                if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
                    await navigator.share({ files: [arquivo], title: "Convite", text: textoCompartilharConvite({ nome: nomeDoEvento }) });
                    marcarConviteGerado();
                    avisar("");
                } else {
                    // aparelho/navegador sem compartilhamento de arquivos: baixa a imagem
                    baixar(blob);
                    avisar("Seu aparelho não permite compartilhar direto. A imagem foi baixada para você enviar.");
                }
            } catch (erro) {
                if (erro && erro.name === "AbortError") return;   // o usuário fechou a janela de compartilhar
                console.error(erro);
                avisar("Não foi possível compartilhar. Tente baixar a imagem.", true);
            }
        });


        // ================= INÍCIO =================

        async function iniciar() {

            mostrarTela("lista");

            if (!eventoId) {
                document.getElementById("nomeEvento").textContent = "Evento não encontrado";
                avisar("Abra o criador de convites a partir da página de um evento.", true);
                return;
            }

            document.getElementById("voltar").href = "evento.html?id=" + encodeURIComponent(eventoId);

            const usuario = await exigirLogin(auth, onAuthStateChanged);
            if (!usuario) return;

            try {
                const snap = await getDoc(doc(db, "eventos", eventoId));

                if (!snap.exists()) {
                    document.getElementById("nomeEvento").textContent = "Evento não encontrado";
                    avisar("Esse evento não existe mais.", true);
                    return;
                }

                const evento = snap.data();
                document.getElementById("nomeEvento").textContent = evento.nome || "Evento sem nome";
                nomeDoEvento = evento.nome || "";

                categoriaDoEvento = evento.categoria || "";

                // primeiro presente da lista (em ordem alfabética) para sugerir no convite
                let primeiroPresente = "";
                try {
                    const presentesSnap = await getDocs(collection(db, "eventos", eventoId, "presentes"));
                    primeiroPresente = presentesSnap.docs.map((d) => d.data().nome).filter(Boolean)
                        .sort((a, b) => String(a).localeCompare(String(b), "pt-BR"))[0] || "";
                } catch (e) { /* sem acesso à lista: segue sem sugestão */ }

                dadosEvento = dadosDoEvento(evento, primeiroPresente);



                montarListaModelos();
            }
            catch (erro) {
                console.error("Erro ao carregar o evento:", erro);
                avisar("Não foi possível carregar o evento.", true);
            }
        }

        iniciar();

    </script>

</body>

</html>
