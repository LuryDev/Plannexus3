<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criador de Convites - PlanNexus</title>
    <link rel="icon" href="fotos/logo.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Chewy&family=Baloo+2:wght@600&family=Montserrat:wght@500;700&family=Playfair+Display:wght@600;700&family=Allura&family=Great+Vibes&family=Dancing+Script:wght@600&family=Lobster&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/convite.css">

    <!-- PWA: manifest, cor do tema e service worker -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5A32D3">
    <script src="js/pwa.js" defer></script>
</head>

<body>

    <div class="app">

        <header>
            <a class="voltar" id="voltar" href="inicio.html" title="Voltar">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1>Convite</h1>
        </header>

        <main>

            <!-- NOME DO EVENTO -->
            <div class="evento">
                <span>Evento</span>
                <h2 id="nomeEvento">Carregando...</h2>
            </div>

            <!-- TELA 1: LISTA DE MODELOS (por tipo de evento) -->
            <div id="telaModelos">
                <p class="dica-modelos">Escolha um modelo de convite. Depois você ajusta os textos.</p>
                <div id="listaModelos"></div>
            </div>

            <!-- TELA 2: MODELO COM DESIGN (pré-visualização + textos) -->
            <div id="telaModelo" hidden>
                <div class="previa-convite previa-fixa">
                    <canvas id="canvasModelo" width="1600" height="1135" aria-label="Prévia do convite"></canvas>
                </div>

                <section class="bloco">
                    <h3>Textos do convite</h3>
                    <p class="dica-campos">Preenchemos com os dados do evento. Você pode trocar qualquer texto e escolher a fonte dele. O restante do desenho é fixo.</p>
                    <div id="camposModelo"></div>
                </section>

                <section class="bloco">
                    <h3>Mensagem para enviar junto</h3>
                    <textarea id="textoMensagem" rows="5" maxlength="700" aria-label="Mensagem do convite"></textarea>

                    <label class="incluir-link" id="blocoIncluirLink" hidden>
                        <input type="checkbox" id="incluirLinkPresenca" checked>
                        Incluir link para confirmar presença
                    </label>

                    <details class="ideias" id="blocoIdeias">
                        <summary><i class="fa-regular fa-lightbulb"></i> Ideias de mensagem</summary>
                        <div id="listaIdeias" class="lista-ideias"></div>
                        <button type="button" class="outras-ideias" id="botaoOutrasIdeias"><i class="fa-solid fa-shuffle"></i> Mostrar outras ideias</button>
                    </details>

                    <div class="linha-mensagem">
                        <button type="button" class="botao-pequeno" id="botaoCopiarTexto"><i class="fa-regular fa-copy"></i> Copiar texto</button>
                        <button type="button" class="botao-pequeno" id="botaoZap"><i class="fa-brands fa-whatsapp"></i> Só o texto no WhatsApp</button>
                    </div>
                </section>
            </div>

            <!-- AÇÕES -->
            <div class="acoes" id="blocoAcoes" hidden>
                <button type="button" class="botao-principal" id="botaoBaixar">
                    <i class="fa-solid fa-download"></i>
                    Baixar imagem
                </button>
                <button type="button" class="botao-secundario" id="botaoCompartilhar">
                    <i class="fa-solid fa-share-nodes"></i>
                    Compartilhar
                </button>
            </div>
            <button type="button" class="botao-trocar" id="botaoTrocar" hidden>Escolher outro modelo</button>
            <p class="mensagem" id="mensagem" role="status"></p>

        </main>

    </div>


    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        import { LINK_PLANNEXUS } from "./js/templateImagem.js";
        import {
            MODELOS, FONTES, modeloPorId, dadosDoEvento, valorAutomatico, valoresIniciais, desenharModelo
        } from "./js/convitesModelos.js";

        // FIREBASE_CONFIG vem do arquivo js/config.js
        const app  = initializeApp(FIREBASE_CONFIG);
        const auth = getAuth(app);
        const db   = getFirestore(app);

        const eventoId = pegarIdDaUrl();

        const mensagem = document.getElementById("mensagem");

        let nomeArquivo = "convite";
        let nomeDoEvento = "";

        // ---- telas: "lista" (modelos) ou "modelo" (design escolhido) ----
        let tela = "lista";
        let categoriaDoEvento = "";
        let dadosEvento = null;          // dados do evento usados no preenchimento automático
        let modeloAtual = null;
        let valoresModelo = {};
        let fontesModelo = {};
        const canvasModelo = document.getElementById("canvasModelo");


        // ================= MODELOS COM DESIGN =================

        function slug(texto) {
            return String(texto || "evento").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "evento";
        }

        function canvasAtivo() {
            return canvasModelo;
        }

        // desenha o modelo aberto (garante que as fontes já carregaram)
        async function desenharAtual() {
            if (modeloAtual) await desenharModelo(canvasModelo, modeloAtual, valoresModelo, fontesModelo, 1600);
        }

        let modeloAgendado = false;
        function agendarModelo() {
            if (modeloAgendado) return;
            modeloAgendado = true;
            requestAnimationFrame(() => {
                modeloAgendado = false;
                if (tela === "modelo" && modeloAtual) {
                    desenharModelo(canvasModelo, modeloAtual, valoresModelo, fontesModelo, 1600);
                    prepararDepois();
                }
            });
        }

        function mostrarTela(nova) {
            tela = nova;
            document.getElementById("telaModelos").hidden = nova !== "lista";
            document.getElementById("telaModelo").hidden  = nova !== "modelo";
            document.getElementById("blocoAcoes").hidden  = nova === "lista";
            document.getElementById("botaoTrocar").hidden = nova === "lista";
            avisar("");
            window.scrollTo(0, 0);
        }

        function montarListaModelos() {
            const lista = document.getElementById("listaModelos");
            lista.innerHTML = "";

            const grupos = [];
            MODELOS.forEach((m) => {
                let g = grupos.find((x) => x.nome === m.grupo);
                if (!g) { g = { nome: m.grupo, categoria: m.categoria, itens: [] }; grupos.push(g); }
                g.itens.push(m);
            });

            // o grupo do tipo do evento vem primeiro
            grupos.sort((a, b) => (b.categoria === categoriaDoEvento) - (a.categoria === categoriaDoEvento));

            grupos.forEach((g) => {
                const titulo = document.createElement("h3");
                titulo.className = "grupo-modelos";
                titulo.textContent = g.nome;
                if (g.categoria === categoriaDoEvento) {
                    const tag = document.createElement("span");
                    tag.className = "tag-sugerido";
                    tag.textContent = "Sugerido para o seu evento";
                    titulo.appendChild(tag);
                }
                lista.appendChild(titulo);

                const grade = document.createElement("div");
                grade.className = "grade-modelos";

                g.itens.forEach((m) => {
                    const botao = document.createElement("button");
                    botao.type = "button";
                    botao.className = "card-modelo";

                    const mini = document.createElement("canvas");
                    const nome = document.createElement("span");
                    nome.textContent = m.nome;
                    botao.append(mini, nome);
                    botao.addEventListener("click", () => abrirModelo(m.id));
                    grade.appendChild(botao);

                    if (dadosEvento) {
                        const ini = valoresIniciais(m, dadosEvento);
                        desenharModelo(mini, m, ini.valores, ini.fontes, 520);
                    }
                });

                lista.appendChild(grade);
            });

            const aviso = document.createElement("p");
            aviso.className = "aviso-modelos";
            aviso.textContent = "Novos modelos para os outros tipos de evento chegam em breve.";
            lista.appendChild(aviso);
        }

        function abrirModelo(id) {
            modeloAtual = modeloPorId(id);
            if (!modeloAtual) return;

            const ini = valoresIniciais(modeloAtual, dadosEvento || dadosDoEvento({}, ""));
            valoresModelo = ini.valores;
            fontesModelo = ini.fontes;
            nomeArquivo = modeloAtual.arquivo + "-" + slug(nomeDoEvento);

            montarCamposModelo();
            mostrarTela("modelo");
            desenharModelo(canvasModelo, modeloAtual, valoresModelo, fontesModelo, 1600);
            document.getElementById("textoMensagem").value = textoPadraoConvite();
            ideiasAtuais = [];
            sortearIdeias();
            if (!tokenPresenca) {
                // cria (ou reaproveita) o link de confirmação e acrescenta a linha na mensagem
                garantirLinkPresenca().then(() => {
                    if (!linkAtivoNaMensagem()) return;
                    const area = document.getElementById("textoMensagem");
                    area.value = comLinhaDoLink(area.value);
                    sortearIdeias();
                });
            }
            prepararDepois();
        }

        function montarCamposModelo() {
            const area = document.getElementById("camposModelo");
            area.innerHTML = "";
            const dados = dadosEvento || dadosDoEvento({}, "");

            modeloAtual.campos.forEach((campo) => {
                const caixa = document.createElement("div");
                caixa.className = "campo-modelo";

                const rotulo = document.createElement("label");
                rotulo.htmlFor = "cm_" + campo.c;
                const nome = document.createElement("span");
                nome.textContent = campo.rotulo;
                const marcas = document.createElement("span");
                marcas.className = "marcas-campo";
                const tagAuto = document.createElement("span");
                tagAuto.className = "tag-auto";
                tagAuto.textContent = "do evento";
                const refazer = document.createElement("button");
                refazer.type = "button";
                refazer.className = "refazer-campo";
                refazer.textContent = "voltar ao do evento";
                marcas.append(tagAuto, refazer);
                rotulo.append(nome, marcas);

                const linha = document.createElement("div");
                linha.className = "linha-campo";

                const entrada = document.createElement("input");
                entrada.type = "text";
                entrada.id = "cm_" + campo.c;
                entrada.maxLength = 60;
                entrada.value = valoresModelo[campo.c] || "";

                const fonte = document.createElement("select");
                fonte.setAttribute("aria-label", "Fonte: " + campo.rotulo);
                FONTES.forEach((f) => {
                    const o = document.createElement("option");
                    o.value = f.f;
                    o.textContent = f.n;
                    o.selected = f.f === fontesModelo[campo.c];
                    fonte.appendChild(o);
                });

                linha.append(entrada, fonte);
                caixa.append(rotulo, linha);
                area.appendChild(caixa);

                // só campos com preenchimento automático mostram a marca / o botão
                function marcar() {
                    const automatico = campo.auto ? valorAutomatico(campo, dados) : null;
                    const igual = automatico !== null && valoresModelo[campo.c] === automatico;
                    tagAuto.hidden = !(igual && automatico);
                    refazer.hidden = automatico === null || igual;
                }
                marcar();

                entrada.addEventListener("input", () => { valoresModelo[campo.c] = entrada.value; marcar(); agendarModelo(); });
                fonte.addEventListener("change", () => { fontesModelo[campo.c] = fonte.value; agendarModelo(); });
                refazer.addEventListener("click", () => {
                    valoresModelo[campo.c] = valorAutomatico(campo, dados);
                    entrada.value = valoresModelo[campo.c];
                    marcar();
                    agendarModelo();
                });
            });
        }

        document.getElementById("botaoTrocar").addEventListener("click", () => mostrarTela("lista"));

        // a seta do topo volta para a lista de modelos quando você está num modelo
        document.getElementById("voltar").addEventListener("click", (e) => {
            if (tela !== "lista") {
                e.preventDefault();
                mostrarTela("lista");
            }
        });


        // ================= BAIXAR E COMPARTILHAR =================

        function avisar(texto, erro = false) {
            mensagem.textContent = texto;
            mensagem.classList.toggle("erro", erro);
        }

        function gerarImagem() {
            return new Promise((resolve, reject) => {
                canvasAtivo().toBlob((blob) => blob ? resolve(blob) : reject(new Error("Falha ao gerar a imagem.")), "image/png");
            });
        }

        function baixar(blob) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = nomeArquivo + ".png";
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 4000);
        }

        // marca no evento que o convite já foi criado (para o Nexus parar de lembrar)
        function marcarConviteGerado() {
            updateDoc(doc(db, "eventos", eventoId), { conviteGerado: true }).catch(() => {});
        }

        document.getElementById("botaoBaixar").addEventListener("click", async () => {
            try {
                await desenharAtual();
                baixar(await gerarImagem());
                marcarConviteGerado();
                avisar("Imagem salva no seu aparelho.");
            } catch (erro) {
                console.error(erro);
                avisar("Não foi possível gerar a imagem. Tente de novo.", true);
            }
        });

        // ---- mensagem que acompanha a imagem ----
        function dataBR(iso) {
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
            return m ? m[3] + "/" + m[2] + "/" + m[1] : "";
        }

        // ---- link para o convidado confirmar presença (página confirmar.html) ----
        let tokenPresenca = null;

        async function chamarPresenca(corpo) {
            const idToken = await auth.currentUser.getIdToken();
            const resposta = await fetch("/api/presenca", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + idToken },
                body: JSON.stringify(corpo)
            });
            const dados = await resposta.json().catch(() => ({}));
            if (!resposta.ok) throw new Error(dados.erro || "Erro " + resposta.status);
            return dados;
        }

        function urlPresenca() {
            return tokenPresenca ? location.origin + "/confirmar.html?c=" + encodeURIComponent(tokenPresenca) : "";
        }

        function linkAtivoNaMensagem() {
            return !!urlPresenca() && document.getElementById("incluirLinkPresenca").checked;
        }

        const MARCA_PLANNEXUS = "\n\nOrganize seus eventos com o Plannexus";

        // coloca a linha do link antes da assinatura do Plannexus (ou no fim)
        function comLinhaDoLink(texto) {
            const url = urlPresenca();
            if (!url || texto.includes(url)) return texto;
            const linha = "\n\n✅ Confirme sua presença aqui: " + url;
            const i = texto.indexOf(MARCA_PLANNEXUS);
            return i >= 0 ? texto.slice(0, i) + linha + texto.slice(i) : texto.trimEnd() + linha;
        }

        function semLinhaDoLink(texto) {
            return texto.replace(/\n*✅ Confirme sua presença aqui: \S+/g, "");
        }

        async function garantirLinkPresenca() {
            if (tokenPresenca) return;
            try {
                const dados = await chamarPresenca({ acao: "criar", eventoId });
                tokenPresenca = dados.token;
            } catch (e) {
                tokenPresenca = null;   // sem permissão ou sem servidor: segue sem o link
            }
            document.getElementById("blocoIncluirLink").hidden = !tokenPresenca;
        }

        document.getElementById("incluirLinkPresenca").addEventListener("change", (e) => {
            const area = document.getElementById("textoMensagem");
            area.value = e.target.checked ? comLinhaDoLink(area.value) : semLinhaDoLink(area.value);
        });

        function textoPadraoConvite() {
            const d = dadosEvento || {};
            const linhas = ["🎉 Você é meu convidado(a) para " + (nomeDoEvento || "o meu evento") + "!"];
            const quando = [dataBR(d.data), d.horario ? "às " + d.horario : ""].filter(Boolean).join(" ");
            if (quando) linhas.push("📅 " + quando);
            if (d.local) linhas.push("📍 " + d.local);
            linhas.push("", "Veja os detalhes na imagem e me confirme se vai! 💜", "", "Organize seus eventos com o Plannexus: " + LINK_PLANNEXUS);
            const base = linhas.join("\n");
            return linkAtivoNaMensagem() ? comLinhaDoLink(base) : base;
        }

        // ---- sugestões prontas (aparecem 3 por vez, sorteadas) ----
        const IDEIAS = [
            "🎉 Você é meu convidado(a) para {evento}!\n{detalhes}Veja o convite na imagem e me confirme se vai! 💜",
            "💌 Tenho um convite especial pra você! {evento} vai ser inesquecível e eu quero você lá.\n{detalhes}Confirma comigo? 😊",
            "✨ Salve a data! {evento}\n{detalhes}Sua presença vai fazer toda a diferença. Conto com você! 💜",
            "Oi! Vai ter {evento} e eu faço questão da sua presença. 🥳\n{detalhes}O convite está na imagem. Me diz se você vem!",
            "🎈 Chegou a hora de comemorar! Você está convidado(a) para {evento}.\n{detalhes}Não falte, vai ser muito especial! 💜",
            "📣 Anota na agenda: {evento}!\n{detalhes}Me manda um \"confirmado\" e venha celebrar comigo. 🎉",
            "Com muito carinho, convido você para {evento}. 💜\n{detalhes}Sua presença é o nosso melhor presente!",
            "Psiu! Reserve esse dia: {evento}. 🥂\n{detalhes}Todos os detalhes estão no convite. Te espero lá!"
        ];

        function detalhesDoEvento() {
            const d = dadosEvento || {};
            const quando = [dataBR(d.data), d.horario ? "às " + d.horario : ""].filter(Boolean).join(" ");
            return (quando ? "📅 " + quando + "\n" : "") + (d.local ? "📍 " + d.local + "\n" : "");
        }

        function montarIdeia(modelo) {
            const base = modelo.replace("{evento}", nomeDoEvento || "o meu evento").replace("{detalhes}", detalhesDoEvento() + (detalhesDoEvento() ? "\n" : ""))
                + "\n\nOrganize seus eventos com o Plannexus: " + LINK_PLANNEXUS;
            return linkAtivoNaMensagem() ? comLinhaDoLink(base) : base;
        }

        let ideiasAtuais = [];
        function sortearIdeias() {
            const base = IDEIAS.filter((m) => !ideiasAtuais.includes(m));
            const pool = (base.length >= 3 ? base : IDEIAS).slice();
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            ideiasAtuais = pool.slice(0, 3);

            const lista = document.getElementById("listaIdeias");
            lista.innerHTML = "";
            ideiasAtuais.forEach((modelo) => {
                const botao = document.createElement("button");
                botao.type = "button";
                botao.className = "ideia";
                const partes = montarIdeia(modelo).split("\n\nOrganize")[0].split("\n").filter((l) => l && !/^[📅📍✅]/u.test(l));
                const trecho = document.createElement("span");
                trecho.textContent = partes.join(" ");
                botao.appendChild(trecho);
                botao.addEventListener("click", () => {
                    document.getElementById("textoMensagem").value = montarIdeia(modelo);
                    document.getElementById("blocoIdeias").open = false;
                    avisar("Mensagem trocada. Você ainda pode editar o texto.");
                });
                lista.appendChild(botao);
            });
        }

        document.getElementById("botaoOutrasIdeias").addEventListener("click", sortearIdeias);

        function textoAtual() {
            const t = document.getElementById("textoMensagem").value.trim();
            return t || textoPadraoConvite();
        }

        function copiarTexto(texto) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    return navigator.clipboard.writeText(texto).then(() => true).catch(() => false);
                }
            } catch (e) { /* segue */ }
            return Promise.resolve(false);
        }

        // ---- imagem pronta antes do clique ----
        // Os celulares só deixam abrir a janela de compartilhar logo depois do toque.
        // Por isso a imagem já fica pronta e o clique chama o compartilhar direto.
        let arquivoPronto = null;
        let versaoArquivo = 0;
        let timerPreparo = null;

        async function prepararArquivo() {
            const versao = ++versaoArquivo;
            await desenharAtual();
            const blob = await gerarImagem();
            const arquivo = new File([blob], nomeArquivo + ".png", { type: "image/png" });
            if (versao === versaoArquivo) arquivoPronto = arquivo;
            return arquivo;
        }

        function prepararDepois() {
            arquivoPronto = null;
            clearTimeout(timerPreparo);
            timerPreparo = setTimeout(() => { prepararArquivo().catch(() => {}); }, 500);
        }

        document.getElementById("botaoCopiarTexto").addEventListener("click", async () => {
            avisar(await copiarTexto(textoAtual()) ? "Texto copiado." : "Não foi possível copiar. Selecione o texto e copie manualmente.", false);
        });

        document.getElementById("botaoZap").addEventListener("click", () => {
            window.open("https://wa.me/?text=" + encodeURIComponent(textoAtual()), "_blank", "noopener");
            avisar("O WhatsApp abriu só com o texto. Para enviar a imagem, use Compartilhar.");
        });

        document.getElementById("botaoCompartilhar").addEventListener("click", async () => {
            const texto = textoAtual();
            copiarTexto(texto);   // garante o texto na área de transferência, caso o app ignore a legenda

            let arquivo = arquivoPronto;
            try {
                if (!arquivo) arquivo = await prepararArquivo();

                if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
                    await navigator.share({ files: [arquivo], title: "Convite", text: texto });
                    marcarConviteGerado();
                    avisar("Se o texto não aparecer na mensagem, é só colar: ele já está copiado.");
                    return;
                }
            } catch (erro) {
                if (erro && erro.name === "AbortError") return;   // o usuário fechou a janela de compartilhar
                console.error(erro);
            }

            // alternativa: baixa a imagem e deixa o texto copiado
            try {
                baixar(arquivo || await gerarImagem());
                marcarConviteGerado();
                avisar("Não deu para abrir o compartilhar neste aparelho. Baixamos a imagem e copiamos o texto: anexe a imagem e cole o texto na conversa.");
            } catch (erro) {
                console.error(erro);
                avisar("Não foi possível preparar a imagem. Tente de novo.", true);
            }
        });


        // ================= INÍCIO =================

        async function iniciar() {

            mostrarTela("lista");

            if (!eventoId) {
                document.getElementById("nomeEvento").textContent = "Evento não encontrado";
                avisar("Abra o criador de convites a partir da página de um evento.", true);
                return;
            }

            document.getElementById("voltar").href = "evento.html?id=" + encodeURIComponent(eventoId);

            const usuario = await exigirLogin(auth, onAuthStateChanged);
            if (!usuario) return;

            try {
                const snap = await getDoc(doc(db, "eventos", eventoId));

                if (!snap.exists()) {
                    document.getElementById("nomeEvento").textContent = "Evento não encontrado";
                    avisar("Esse evento não existe mais.", true);
                    return;
                }

                const evento = snap.data();
                document.getElementById("nomeEvento").textContent = evento.nome || "Evento sem nome";
                nomeDoEvento = evento.nome || "";

                categoriaDoEvento = evento.categoria || "";

                // primeiro presente da lista (em ordem alfabética) para sugerir no convite
                let primeiroPresente = "";
                try {
                    const presentesSnap = await getDocs(collection(db, "eventos", eventoId, "presentes"));
                    primeiroPresente = presentesSnap.docs.map((d) => d.data().nome).filter(Boolean)
                        .sort((a, b) => String(a).localeCompare(String(b), "pt-BR"))[0] || "";
                } catch (e) { /* sem acesso à lista: segue sem sugestão */ }

                dadosEvento = dadosDoEvento(evento, primeiroPresente);



                montarListaModelos();
            }
            catch (erro) {
                console.error("Erro ao carregar o evento:", erro);
                avisar("Não foi possível carregar o evento.", true);
            }
        }

        iniciar();

    </script>

</body>

</html>
