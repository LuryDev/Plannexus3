<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Convidados - Plannexus</title>
    <link rel="icon" href="fotos/logo.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/presentes.css">
    <link rel="stylesheet" href="css/escuro/presentes.css">
    <link rel="stylesheet" href="css/convidados.css">
    <link rel="stylesheet" href="css/escuro/convidados.css">
    <link rel="stylesheet" href="css/ajuda.css">
    <link rel="stylesheet" href="css/escuro/ajuda.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">

    <!-- PWA: manifest, cor do tema e service worker -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5A32D3">
    <script src="js/pwa.js" defer></script>
    <link rel="stylesheet" href="css/nexusFlutuante.css">
    <link rel="stylesheet" href="css/escuro/nexusFlutuante.css">
    <link rel="stylesheet" href="css/responsivo.css">
    <link rel="stylesheet" href="css/acessibilidade.css">
    <link rel="stylesheet" href="css/temaEscuro.css">
    <script src="js/preferencias.js"></script>
</head>

<body>

    <div class="app">

        <header>
            <a class="voltar" id="voltar" href="inicio.html" title="Voltar">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1>Convidados</h1>
        </header>

        <main>

            <h2 class="titulo-lista" id="titulo">Sua lista de convidados</h2>

            <div class="contagem" id="contagem" hidden>
                <strong id="contagemNumeros">0/0</strong>
                <span>convidados confirmados</span>
                <div class="barra" id="barra" hidden><i id="barraPreenchida"></i></div>
            </div>

            <!-- LINK QUE O CONVIDADO ABRE PARA CONFIRMAR -->
            <div class="painel-link" id="painelLink" hidden>
                <p class="painel-titulo"><i class="fa-solid fa-link"></i> Link de confirmação de presença<button type="button" class="ajuda-btn" data-ajuda-titulo="Link de confirmação" data-ajuda="Envie o link aos convidados: eles confirmam sem precisar de conta. | O que o convidado pode informar (crianças, acompanhantes, alimentação) você define na página do evento, em Recursos do evento > Regras de confirmação. | Toque em um nome para ver os detalhes; o X remove da lista." aria-label="Ajuda">?</button></p>
                <p class="painel-texto" id="painelTexto">Quem receber o link coloca nome e e-mail para confirmar presença. Cada e-mail confirma uma vez só.</p>
                <div class="painel-botoes" id="botoesLink">
                    <button type="button" id="botaoCopiarLink"><i class="fa-regular fa-copy"></i> Copiar link</button>
                    <button type="button" id="botaoDesativarLink" class="perigo"><i class="fa-solid fa-ban"></i> Desativar</button>
                </div>
                <div class="painel-botoes" id="botaoCriarBloco" hidden>
                    <button type="button" id="botaoCriarLink"><i class="fa-solid fa-link"></i> Criar link de confirmação</button>
                </div>
            </div>

            <!-- resumo para o buffet: aparece só para dono/colaborador e só se houver o que somar -->
            <div class="resumo-evento" id="resumoEvento" hidden></div>

            <!-- filtros e exportação: só para dono/colaborador -->
            <div class="barra-lista" id="barraLista" hidden>
                <div class="filtros" id="filtros" role="group" aria-label="Filtrar lista">
                    <button type="button" class="filtro ativo" data-f="todos">Todos</button>
                    <button type="button" class="filtro" data-f="sim">Confirmados</button>
                    <button type="button" class="filtro" data-f="nao">Ausentes</button>
                </div>
                <div class="exportar">
                    <button type="button" class="btn-exportar" id="botaoExportar" aria-expanded="false"><i class="fa-solid fa-file-export"></i> Exportar</button>
                    <div class="menu-exportar" id="menuExportar" hidden>
                        <button type="button" data-fmt="pdf"><i class="fa-regular fa-file-pdf"></i> PDF</button>
                        <button type="button" data-fmt="csv"><i class="fa-regular fa-file-excel"></i> Planilha</button>
                    </div>
                </div>
                <button type="button" class="ajuda-btn" data-ajuda-titulo="Lista de convidados" data-ajuda="Toque em um nome para ver família, crianças e alimentação. | Use os filtros para ver só quem confirmou ou quem não poderá ir. | Exportar gera a lista do filtro escolhido em PDF ou planilha (abre no Excel)." aria-label="Ajuda">?</button>
            </div>

            <p class="subtitulo-lista" id="subtitulo" hidden>Convidados que confirmaram presença:</p>

            <ol class="lista-confirmados" id="listaConfirmados"></ol>
            <p class="subtitulo-lista" id="subtituloAusentes" hidden>Não poderão comparecer:</p>
            <ul class="lista-confirmados lista-ausentes" id="listaAusentes"></ul>
            <p class="aviso" id="aviso">Carregando...</p>

        </main>

    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>

    <script src="js/ajuda.js"></script>
    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { marcarVista, marcarAtividadeVista } from "./js/pendencias.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        import { atualizarPeriodicamente } from "./js/tempoReal.js";

        // FIREBASE_CONFIG vem do arquivo js/config.js
        const app  = initializeApp(FIREBASE_CONFIG);
        const auth = getAuth(app);
        const db   = getFirestore(app);

        const eventoId = pegarIdDaUrl();

        const tituloEl = document.getElementById("titulo");
        const avisoEl = document.getElementById("aviso");
        const listaEl = document.getElementById("listaConfirmados");
        const listaAusentesEl = document.getElementById("listaAusentes");

        let podeGerenciar = false;     // dono ou colaborador: pode criar/desativar o link e remover nomes
        let tokenPresenca = null;
        let nomeDoEvento = "";

        function escaparTexto(t) {
            return String(t == null ? "" : t)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        async function chamarPresenca(corpo) {
            const idToken = await auth.currentUser.getIdToken();
            const resposta = await fetch("/api/presenca", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + idToken },
                body: JSON.stringify(corpo)
            });
            const dados = await resposta.json().catch(() => ({}));
            if (!resposta.ok) throw new Error(dados.erro || "Erro " + resposta.status);
            return dados;
        }

        function mostrarAviso(texto, erro = false) {
            avisoEl.textContent = texto;
            avisoEl.classList.toggle("erro", erro);
            avisoEl.hidden = !texto;
        }

        // resumo curto sob o nome: "3 pessoas · 2 crianças"
        function resumoCurto(c) {
            const partes = [];
            if (c.pessoas > 1) partes.push(c.pessoas + " pessoas");
            if (c.criancas) partes.push(c.criancas + (c.criancas > 1 ? " crianças" : " criança"));
            return partes.join(" · ");
        }

        // detalhes que aparecem ao tocar no nome (só dono/colaborador)
        function linhasDetalhe(c) {
            const l = [];
            if (c.pessoas != null) l.push(["Pessoas", c.pessoas + (c.acompanhantes ? " (com " + c.acompanhantes + (c.acompanhantes > 1 ? " acompanhantes" : " acompanhante") + ")" : "")]);
            if (c.criancas) l.push(["Crianças", String(c.criancas)]);
            if (c.alimentacao && c.alimentacao.length) l.push(["Alimentação", c.alimentacao.join(", ")]);
            if (c.relacao) l.push(["Relação", c.relacao]);
            if (c.quando) l.push(["Respondeu em", new Date(c.quando).toLocaleDateString("pt-BR")]);
            return l;
        }

        function desenharResumo(dados) {
            const t = dados.totais || {};
            const el = document.getElementById("resumoEvento");
            const ali = Object.keys(t.alimentacao || {});
            const nConf = (dados.confirmados || []).length, nAus = (dados.ausentes || []).length;
            const temAlgo = dados.gestor && (nConf + nAus) > 0;
            el.hidden = !temAlgo;
            if (!temAlgo) return;
            el.innerHTML =
                '<p class="resumo-titulo"><i class="fa-solid fa-chart-simple"></i> Totais</p>' +
                '<div class="resumo-numeros">' +
                    '<div><b>' + t.pessoas + '</b><span>pessoas</span></div>' +
                    '<div><b>' + t.adultos + '</b><span>adultos</span></div>' +
                    '<div><b>' + t.criancas + '</b><span>crianças</span></div>' +
                '</div>' +
                '<p class="resumo-alim">Situação: <b>' + nConf + '</b> confirmaram · <b>' + nAus + '</b> não poderão</p>' +
                (ali.length ? '<p class="resumo-alim">' + ali.map((a) => escaparTexto(a) + ": <b>" + t.alimentacao[a] + "</b>").join(" · ") + '</p>' : "");
        }

        // ---------- lista de confirmados ----------
        let ultimosDados = null;
        let filtro = "todos";

        function desenharLista(dados) {
            ultimosDados = dados;
            const confirmados = filtro === "nao" ? [] : (dados.confirmados || []);
            const esperados = dados.esperados || 0;

            tituloEl.textContent = "Sua lista de convidados do evento - " + (dados.evento || nomeDoEvento);

            document.getElementById("contagem").hidden = false;
            const totalPessoas = dados.totais && dados.totais.pessoas ? dados.totais.pessoas : confirmados.length;
            document.getElementById("contagemNumeros").textContent =
                totalPessoas + (esperados > 0 ? "/" + esperados : "");

            const barra = document.getElementById("barra");
            barra.hidden = !(esperados > 0);
            document.getElementById("barraPreenchida").style.width =
                esperados > 0 ? Math.min(100, Math.round(totalPessoas / esperados * 100)) + "%" : "0%";

            const ausentes = filtro === "sim" ? [] : (dados.ausentes || []);
            desenharResumo(dados);
            document.getElementById("barraLista").hidden = !(dados.gestor && ((dados.confirmados || []).length + (dados.ausentes || []).length) > 0);

            document.getElementById("subtitulo").hidden = !confirmados.length;
            document.getElementById("subtituloAusentes").hidden = !ausentes.length;
            listaEl.innerHTML = "";
            listaAusentesEl.innerHTML = "";

            // uma linha da lista (com o X de remover para dono/colaborador)
            function montarItem(c, posicao, ondeColocar, textoRemover) {
                const item = document.createElement("li");
                const detalhes = dados.gestor && posicao ? linhasDetalhe(c) : [];
                const curto = dados.gestor && posicao ? resumoCurto(c) : "";
                item.innerHTML =
                    (posicao ? '<span class="posicao">' + posicao + ' -</span>' : '') +
                    '<span class="nome-confirmado">' + (detalhes.length
                        ? '<button type="button" class="abrir-detalhe" aria-expanded="false"><span>' + escaparTexto(c.nome) + (curto ? '<small class="detalhe-conf">' + escaparTexto(curto) + '</small>' : '') + '</span><i class="fa-solid fa-chevron-down"></i></button>' +
                          '<dl class="detalhes-conf" hidden>' + detalhes.map((d) => '<dt>' + d[0] + '</dt><dd>' + escaparTexto(d[1]) + '</dd>').join("") + '</dl>'
                        : escaparTexto(c.nome)) + '</span>' +
                    (podeGerenciar ? '<button type="button" class="remover" title="Remover da lista" aria-label="Remover ' + escaparTexto(c.nome) + ' da lista"><i class="fa-solid fa-xmark"></i></button>' : "");

                const abrir = item.querySelector(".abrir-detalhe");
                if (abrir) abrir.addEventListener("click", () => {
                    const dl = item.querySelector(".detalhes-conf");
                    dl.hidden = !dl.hidden;
                    item.classList.toggle("aberto", !dl.hidden);
                    abrir.setAttribute("aria-expanded", String(!dl.hidden));
                });

                if (podeGerenciar) {
                    item.querySelector(".remover").addEventListener("click", async () => {
                        if (!confirm(textoRemover)) return;
                        try {
                            await chamarPresenca({ acao: "remover", eventoId, presencaId: c.id });
                            await carregarLista();
                        } catch (erro) {
                            alert("Não foi possível remover: " + erro.message);
                        }
                    });
                }
                ondeColocar.appendChild(item);
            }

            confirmados.forEach((c, i) => montarItem(c, i + 1, listaEl,
                "Remover " + c.nome + " da lista de confirmados? Essa pessoa poderá responder de novo."));
            ausentes.forEach((c) => montarItem(c, 0, listaAusentesEl,
                "Remover " + c.nome + " da lista? Essa pessoa poderá responder de novo."));

            if (!confirmados.length && !ausentes.length && filtro !== "todos") {
                mostrarAviso("Ninguém nesta categoria.");
            } else if (!confirmados.length && !ausentes.length) {
                mostrarAviso(podeGerenciar
                    ? "Ninguém confirmou presença ainda. Compartilhe o link de confirmação com seus convidados."
                    : "Ninguém confirmou presença ainda.");
            } else if (!confirmados.length && filtro === "todos") {
                mostrarAviso("Ninguém confirmou presença ainda.");
            } else {
                mostrarAviso("");
            }
        }

        // Só redesenha quando algo mudou (assim detalhes abertos não fecham sozinhos)
        let assinaturaLista = "";
        let atualizacaoAuto = null;
        async function carregarLista() {
            const dados = await chamarPresenca({ acao: "lista", eventoId });
            const assinatura = JSON.stringify(dados);
            if (assinatura !== assinaturaLista) {
                assinaturaLista = assinatura;
                desenharLista(dados);
            }
            // novas confirmações chegam sozinhas, sem recarregar a página
            if (!atualizacaoAuto) atualizacaoAuto = atualizarPeriodicamente(carregarLista, 15000);
        }

        // ---------- filtros e exportação ----------
        document.getElementById("filtros").addEventListener("click", (e) => {
            const b = e.target.closest(".filtro");
            if (!b) return;
            filtro = b.dataset.f;
            document.querySelectorAll("#filtros .filtro").forEach((x) => x.classList.toggle("ativo", x === b));
            if (ultimosDados) desenharLista(ultimosDados);
        });

        const menuExp = document.getElementById("menuExportar");
        const botaoExp = document.getElementById("botaoExportar");
        botaoExp.addEventListener("click", (e) => {
            e.stopPropagation();
            menuExp.hidden = !menuExp.hidden;
            botaoExp.setAttribute("aria-expanded", String(!menuExp.hidden));
        });
        document.addEventListener("click", () => { menuExp.hidden = true; botaoExp.setAttribute("aria-expanded", "false"); });

        // linhas da tabela exportada, respeitando o filtro escolhido
        function linhasExportacao() {
            const d = ultimosDados || {};
            const linhas = [];
            if (filtro !== "nao") (d.confirmados || []).forEach((c) => linhas.push([c.nome, "Confirmado", c.pessoas || 1, c.criancas || 0,
                (c.alimentacao || []).join(", "), c.relacao || ""]));
            if (filtro !== "sim") (d.ausentes || []).forEach((c) => linhas.push([c.nome, "Não poderá", 0, 0, "", ""]));
            return linhas;
        }
        const CABECALHO = ["Nome", "Situação", "Pessoas", "Crianças", "Alimentação", "Relação"];

        function nomeArquivo(ext) {
            const base = (nomeDoEvento || "evento").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase() || "evento";
            return "convidados-" + base + "." + ext;
        }

        function montarCsv(linhas) {
            const cel = (v) => '"' + String(v).replace(/"/g, '""') + '"';
            return "\ufeff" + [CABECALHO].concat(linhas).map((l) => l.map(cel).join(";")).join("\r\n");
        }

        // PDF simples (Helvetica), sem bibliotecas
        function montarPdf(titulo, subtitulo, linhas) {
            const esc = (t) => String(t).replace(/[\\()]/g, "\\$&").replace(/[^\x20-\x7e]/g, (ch) => {
                const c = ch.charCodeAt(0);
                return c < 256 ? "\\" + c.toString(8).padStart(3, "0") : "?";
            });
            const colunas = [0, 190, 270, 325, 380]; // x de cada coluna
            const paginas = [];
            let atual = null, y = 0;
            function nova() { atual = []; paginas.push(atual); y = 800;
                atual.push("BT /F2 15 Tf 40 " + y + " Td (" + esc(titulo) + ") Tj ET"); y -= 20;
                atual.push("BT /F1 10 Tf 40 " + y + " Td (" + esc(subtitulo) + ") Tj ET"); y -= 26;
                cabecalho(); }
            function texto(x, t, fonte, tam) { atual.push("BT /" + fonte + " " + tam + " Tf " + x + " " + y + " Td (" + esc(t) + ") Tj ET"); }
            function cabecalho() {
                ["Nome", "Situação", "Pessoas", "Crianças", "Alimentação / relação"].forEach((h, i) => texto(40 + colunas[i], h, "F2", 10));
                y -= 6; atual.push("40 " + y + " m 555 " + y + " l S"); y -= 14; }
            nova();
            linhas.forEach((l) => {
                if (y < 50) nova();
                const extra = [l[4], l[5]].filter(Boolean).join(" / ");
                const nome = String(l[0]).slice(0, 32);
                texto(40 + colunas[0], nome, "F1", 10);
                texto(40 + colunas[1], l[1], "F1", 10);
                texto(40 + colunas[2], l[1] === "Confirmado" ? String(l[2]) : "-", "F1", 10);
                texto(40 + colunas[3], l[1] === "Confirmado" ? String(l[3]) : "-", "F1", 10);
                texto(40 + colunas[4], extra.slice(0, 28), "F1", 10);
                y -= 16;
            });
            const objs = [];
            const total = paginas.length;
            objs[1] = "<< /Type /Catalog /Pages 2 0 R >>";
            objs[2] = "<< /Type /Pages /Kids [" + paginas.map((_, i) => (6 + i * 2) + " 0 R").join(" ") + "] /Count " + total + " >>";
            objs[3] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
            objs[4] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
            objs[5] = "<< >>";
            paginas.forEach((cmds, i) => {
                const conteudo = cmds.join("\n");
                objs[6 + i * 2] = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents " + (7 + i * 2) + " 0 R >>";
                objs[7 + i * 2] = "<< /Length " + conteudo.length + " >>\nstream\n" + conteudo + "\nendstream";
            });
            let pdf = "%PDF-1.4\n"; const pos = [];
            for (let i = 1; i < objs.length; i++) { pos[i] = pdf.length; pdf += i + " 0 obj\n" + objs[i] + "\nendobj\n"; }
            const xref = pdf.length;
            pdf += "xref\n0 " + objs.length + "\n0000000000 65535 f \n";
            for (let i = 1; i < objs.length; i++) pdf += String(pos[i]).padStart(10, "0") + " 00000 n \n";
            pdf += "trailer\n<< /Size " + objs.length + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF";
            const bytes = new Uint8Array(pdf.length);
            for (let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 255;
            return bytes;
        }

        async function entregarArquivo(blob, nome) {
            try {
                const arquivo = new File([blob], nome, { type: blob.type });
                if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
                    await navigator.share({ files: [arquivo], title: nome });
                    return;
                }
            } catch (e) { if (e && e.name === "AbortError") return; }
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 4000);
        }

        menuExp.addEventListener("click", async (e) => {
            const b = e.target.closest("button[data-fmt]");
            if (!b) return;
            const linhas = linhasExportacao();
            if (!linhas.length) { alert("Não há ninguém nesta lista para exportar."); return; }
            if (b.dataset.fmt === "csv") {
                await entregarArquivo(new Blob([montarCsv(linhas)], { type: "text/csv;charset=utf-8" }), nomeArquivo("csv"));
            } else {
                const t = (ultimosDados && ultimosDados.totais) || {};
                const sub = (filtro === "sim" ? "Confirmados" : filtro === "nao" ? "Não poderão" : "Todos") +
                    " · " + (t.pessoas || 0) + " pessoas (" + (t.adultos || 0) + " adultos, " + (t.criancas || 0) + " crianças) · " + new Date().toLocaleDateString("pt-BR");
                await entregarArquivo(new Blob([montarPdf("Convidados - " + (nomeDoEvento || "Evento"), sub, linhas)], { type: "application/pdf" }), nomeArquivo("pdf"));
            }
            menuExp.hidden = true;
        });

        // ---------- link de confirmação ----------
        function urlDoLink() {
            return tokenPresenca ? location.origin + "/confirmar.html?c=" + encodeURIComponent(tokenPresenca) : "";
        }

        function atualizarPainelLink() {
            document.getElementById("painelLink").hidden = !podeGerenciar;
            document.getElementById("botoesLink").hidden = !tokenPresenca;
            document.getElementById("botaoCriarBloco").hidden = !!tokenPresenca;
            document.getElementById("painelTexto").textContent = tokenPresenca
                ? "Quem receber o link coloca nome e e-mail para confirmar presença. Cada e-mail confirma uma vez só."
                : "Crie um link para os convidados confirmarem presença. Você também pode incluí-lo na mensagem do convite.";
        }

        document.getElementById("botaoCriarLink").addEventListener("click", async () => {
            try {
                const dados = await chamarPresenca({ acao: "criar", eventoId });
                tokenPresenca = dados.token;
                atualizarPainelLink();
            } catch (erro) {
                alert("Não foi possível criar o link: " + erro.message);
            }
        });

        document.getElementById("botaoCopiarLink").addEventListener("click", async () => {
            const url = urlDoLink();
            if (!url) return;
            try {
                await navigator.clipboard.writeText(url);
                alert("Link copiado! Envie para seus convidados.");
            } catch (e) {
                prompt("Copie o link:", url);
            }
        });

        document.getElementById("botaoDesativarLink").addEventListener("click", async () => {
            if (!confirm("Desativar o link? Quem tiver o link antigo não conseguirá mais confirmar presença. Os nomes já confirmados continuam aqui.")) return;
            try {
                await chamarPresenca({ acao: "desativar", eventoId });
                tokenPresenca = null;
                atualizarPainelLink();
            } catch (erro) {
                alert("Não foi possível desativar: " + erro.message);
            }
        });


        // ================= INÍCIO =================
        async function iniciar() {

            if (!eventoId) {
                tituloEl.textContent = "Evento não encontrado";
                mostrarAviso("Abra a lista a partir da página de um evento.", true);
                return;
            }

            document.getElementById("voltar").href = "evento.html?id=" + encodeURIComponent(eventoId);

            const usuario = await exigirLogin(auth, onAuthStateChanged);
            if (!usuario) return;

            // 1) mostra na hora a última lista vista (se houver) enquanto o servidor responde
            const chaveCache = "convidados_" + eventoId;
            try {
                const salvo = JSON.parse(localStorage.getItem(chaveCache) || "null");
                if (salvo && Array.isArray(salvo.confirmados)) desenharLista(salvo);
            } catch (e) { /* sem cache, tudo bem */ }

            // 2) dispara o servidor JÁ, em paralelo com a leitura do evento
            //    (antes ele esperava o Firestore terminar para só então começar)
            const listaPromessa = chamarPresenca({ acao: "lista", eventoId });
            const estadoPromessa = chamarPresenca({ acao: "estado", eventoId }).catch(() => null);
            listaPromessa.catch(() => {});   // o erro é tratado abaixo

            try {
                const eventoSnap = await getDoc(doc(db, "eventos", eventoId));

                if (!eventoSnap.exists()) {
                    tituloEl.textContent = "Evento não encontrado";
                    mostrarAviso("Esse evento não existe mais.", true);
                    return;
                }

                const evento = eventoSnap.data();
                nomeDoEvento = evento.nome || "";
                tituloEl.textContent = "Sua lista de convidados do evento - " + nomeDoEvento;

                if (evento.usuarioId === usuario.uid) {
                    podeGerenciar = true;
                } else {
                    const membroSnap = await getDoc(doc(db, "eventos", eventoId, "membros", usuario.uid));
                    podeGerenciar = membroSnap.exists() && membroSnap.data().papel === "colaborador";
                }

                const dadosLista = await listaPromessa;
                desenharLista(dadosLista);
                try { localStorage.setItem(chaveCache, JSON.stringify(dadosLista)); } catch (e) { /* ok */ }
                // viu a lista: some a bolinha de "novas respostas" na página do evento
                marcarVista(usuario.uid, eventoId, "convidados");
                marcarAtividadeVista(usuario.uid, eventoId, "convidados");

                if (podeGerenciar) {
                    const estado = await estadoPromessa;
                    tokenPresenca = estado && estado.ativo ? estado.token : null;
                    atualizarPainelLink();
                }
            } catch (erro) {
                console.error("Erro ao carregar convidados:", erro);
                mostrarAviso("Não foi possível carregar a lista de convidados.", true);
            }
        }

        iniciar();

    </script>
