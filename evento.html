<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento - PlanNexus</title>
    <link rel="icon" href="fotos/logo.png">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/evento.css">
</head>

<body>

    <div class="app">

        <header>
            <a class="voltar" href="inicio.html" title="Voltar">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
        </header>

        <main class="detalhesEvento">

            <div class="card-header-evento">

                <div class="logo-evento">
                    <img
                        src="fotos/logo.png"
                        alt="Logo Evento"
                    >
                </div>

                <h1 id="nomeEvento">Carregando...</h1>

            </div>

            <div class="menu-cards">

                <a href="#" id="linkCalendario" class="card-item">
                    <span>Calendário</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>

                <a href="#" id="linkTarefas" class="card-item">
                    <span>Tarefas</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>

                <a href="#" class="card-item card-grafico">

                    <div class="card-info">
                        <span>Controle Financeiro</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>

                    <div class="grafico-bg"></div>

                </a>

                <a href="#" class="card-item">
                    <span>bla bla</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>

            </div>

        </main>

    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    // FIREBASE_CONFIG vem do arquivo js/config.js
    const app  = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db   = getFirestore(app);

        const parametros =
            new URLSearchParams(window.location.search);

        const eventoId =
            parametros.get("id");


        const nomeEvento =
            document.getElementById("nomeEvento");

        const linkCalendario =
            document.getElementById("linkCalendario");

        const linkTarefas =
            document.getElementById("linkTarefas");


        function esconderLinks() {
            linkCalendario.style.display = "none";
            linkTarefas.style.display = "none";
        }


        async function carregarEvento() {

            if (!eventoId) {

                nomeEvento.textContent =
                    "Evento não encontrado.";

                esconderLinks();

                return;

            }


            await exigirLogin(auth, onAuthStateChanged);

            try {

                const referencia =
                    doc(db, "eventos", eventoId);

                const resultado =
                    await getDoc(referencia);


                if (!resultado.exists()) {

                    nomeEvento.textContent =
                        "Evento não encontrado.";

                    esconderLinks();

                    return;

                }


                const evento =
                    resultado.data();


                nomeEvento.textContent =
                    evento.nome || "Sem nome";


                linkCalendario.href =
                    "calendario.html?id=" +
                    encodeURIComponent(eventoId);

                linkTarefas.href =
                    "tarefas.html?id=" +
                    encodeURIComponent(eventoId);


            }

            catch (erro) {

                console.error(
                    "Erro ao carregar evento:",
                    erro
                );

                nomeEvento.textContent =
                    "Erro ao carregar evento.";

            }

        }


        carregarEvento();

    </script>

</body>

</html>
