<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Evento</title>
    <link rel="icon" href="fotos/logo.png">

    <link rel="stylesheet" href="css/criarEvento.css">
    <link rel="stylesheet" href="css/modalNexus.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


    <!-- PWA: manifest, cor do tema e service worker -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5A32D3">
    <script src="js/pwa.js" defer></script>
    <link rel="stylesheet" href="css/transicao.css">
    <script src="js/transicao.js" defer></script>
    <link rel="stylesheet" href="css/responsivo.css">
    <link rel="stylesheet" href="css/acessibilidade.css">
    <script src="js/preferencias.js"></script>
</head>

<body>

<div class="container">

    <header>

        <a href="indexAdmin.html" class="voltar">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h2>Novo Evento</h2>

    </header>


    <!-- ATALHO PARA CRIAR O EVENTO COM O NEXUS -->
    <a href="nexus.html" class="atalho-nexus">

        <img src="fotos/mascote.png" alt="Nexus, mascote do Plannexus">

        <span class="atalho-nexus-texto">
            <strong>Crie o evento com o Nexus!</strong>
            <small>Converse com nosso assistente e ele monta tudo para você.</small>
        </span>

        <i class="fa-solid fa-arrow-right"></i>

    </a>


    <form id="formEvento">

        <div class="campo">

            <label>Nome do evento</label>

            <input
                type="text"
                id="nomeEvento"
                placeholder="Ex: Casamento João e Maria"
                required
            >

        </div>


        <!-- TIPO DE EVENTO (ícones) -->
        <div class="campo">

            <label>Categoria</label>

            <div class="tipos-evento" id="tiposEvento">
                <button type="button" class="tipo-evento ativo" data-valor="Casamento"><i class="fa-solid fa-heart"></i><span>Casamento</span></button>
                <button type="button" class="tipo-evento" data-valor="Aniversário"><i class="fa-solid fa-cake-candles"></i><span>Aniversário</span></button>
                <button type="button" class="tipo-evento" data-valor="Formatura"><i class="fa-solid fa-graduation-cap"></i><span>Formatura</span></button>
                <button type="button" class="tipo-evento" data-valor="Evento Corporativo"><i class="fa-solid fa-briefcase"></i><span>Corporativo</span></button>
                <button type="button" class="tipo-evento" data-valor="Chá de Bebê"><i class="fa-solid fa-baby"></i><span>Chá de Bebê</span></button>
                <button type="button" class="tipo-evento" data-valor="Outro"><i class="fa-solid fa-star"></i><span>Outro</span></button>
            </div>

            <input type="hidden" id="categoria" value="Casamento">

        </div>


        <div class="duplo">

            <div class="campo">

                <label>Data</label>

                <input
                    type="date"
                    id="data"
                    required
                >

            </div>


            <div class="campo">

                <label>Horário</label>

                <input
                    type="time"
                    id="horario"
                    required
                >

            </div>

        </div>


        <div class="campo">

            <label>Local</label>

            <input
                type="text"
                id="local"
                placeholder="Digite o endereço"
                required
            >

        </div>


        <div class="duplo">

            <div class="campo">

                <label>Número de Convidados</label>

                <input
                    type="number"
                    id="convidados"
                    min="0"
                >

            </div>


            <div class="campo">

                <label>Orçamento Inicial (R$)</label>

                <input
                    type="number"
                    id="orcamento"
                    min="0"
                    step="0.01"
                >

            </div>

        </div>


        <label class="opcao-presentes" for="listaPresentes">

            <input type="checkbox" id="listaPresentes">

            <span>
                <i class="fa-solid fa-gift"></i>
                Incluir lista de presentes?
            </span>

        </label>

        <label class="opcao-presentes" for="criadorConvites">

            <input type="checkbox" id="criadorConvites">

            <span>
                <i class="fa-solid fa-envelope-open-text"></i>
                Gostaria de incluir o criador de convites Plannexus?
            </span>

        </label>



        <div class="campo">

            <label>Descrição</label>

            <textarea
                id="descricao"
                rows="6"
                placeholder="Descreva seu evento..."
            ></textarea>

        </div>


        <button type="submit" id="botaoCriar">

            Criar Evento

        </button>


        <p id="mensagem"></p>

    </form>

</div>


    <!-- MODAL DO NEXUS -->
    <div class="modal-nexus" id="modalNexus" hidden role="dialog" aria-modal="true" aria-labelledby="tituloModalNexus">
        <div class="modal-nexus-caixa">
            <img src="fotos/mascote.png" alt="Nexus, mascote do Plannexus">
            <h2 id="tituloModalNexus">Gostaria de criar um evento com o Nexus?</h2>
            <button type="button" class="modal-nexus-sim" id="nexusSim">Sim</button>
            <button type="button" class="modal-nexus-nao" id="nexusNao">Não</button>
        </div>
    </div>

<script src="js/config.js"></script>
<script>
    // Seleção do tipo de evento pelos ícones
    document.querySelectorAll(".tipo-evento").forEach((botao) => {
        botao.addEventListener("click", () => {
            document.querySelectorAll(".tipo-evento").forEach((b) => b.classList.remove("ativo"));
            botao.classList.add("ativo");
            document.getElementById("categoria").value = botao.dataset.valor;
        });
    });

    // Modal do Nexus ao tentar voltar
    const modalNexus = document.getElementById("modalNexus");

    function abrirModalNexus() {
        modalNexus.hidden = false;
    }

    document.querySelector("a.voltar").addEventListener("click", (e) => {
        e.preventDefault();
        abrirModalNexus();
    });

    // botão "voltar" do celular/navegador
    history.pushState({ nexus: true }, "", window.location.href);
    window.addEventListener("popstate", () => {
        history.pushState({ nexus: true }, "", window.location.href);
        abrirModalNexus();
    });

    document.getElementById("nexusSim").addEventListener("click", () => {
        window.location.href = "nexus.html";
    });

    document.getElementById("nexusNao").addEventListener("click", () => {
        window.location.href = "indexAdmin.html";
    });

</script>

<script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    // FIREBASE_CONFIG vem do arquivo js/config.js
    const app  = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // ==========================================
    // IMPORTS DO FIREBASE
    // ==========================================







    // ==========================================
    // CONFIGURAÇÃO DO FIREBASE
    // ==========================================



    // ==========================================
    // INICIALIZAR FIREBASE
    // ==========================================



    // Authentication



    // Firestore




    const formulario =
        document.getElementById("formEvento");

    const mensagem =
        document.getElementById("mensagem");

    const botaoCriar =
        document.getElementById("botaoCriar");



    let usuarioAtual = null;


    onAuthStateChanged(auth, (usuario) => {


        if (!usuario) {

            alert("Faça login para continuar!");

            window.location.href = "login.html";

            return;

        }


        usuarioAtual = usuario;


        console.log("Usuário logado!");

        console.log("UID:", usuario.uid);

    });


    // ==========================================
    // CADASTRAR EVENTO
    // ==========================================

    formulario.addEventListener("submit", async (event) => {


        event.preventDefault();



        if (!usuarioAtual) {

            alert("Você precisa estar logado.");

            window.location.href = "login.html";

            return;

        }


        // ======================================
        // PEGAR DADOS DO FORMULÁRIO
        // ======================================

        const nome =
            document.getElementById("nomeEvento").value.trim();


        const categoria =
            document.getElementById("categoria").value;


        const data =
            document.getElementById("data").value;


        const horario =
            document.getElementById("horario").value;


        const local =
            document.getElementById("local").value.trim();


        const convidados =
            document.getElementById("convidados").value;


        const orcamento =
            document.getElementById("orcamento").value;


        const descricao =
            document.getElementById("descricao").value.trim();


        // ======================================
        // DESABILITAR BOTÃO
        // ======================================

        botaoCriar.disabled = true;

        botaoCriar.textContent =
            "Criando evento...";


        try {


            // ==================================
            // SALVAR NO FIRESTORE
            // ==================================

            const evento = await addDoc(

                collection(db, "eventos"),

                {

                    nome: nome,

                    categoria: categoria,

                    data: data,

                    horario: horario,

                    local: local,

                    convidados:
                        convidados
                            ? Number(convidados)
                            : 0,

                    orcamento:
                        orcamento
                            ? Number(orcamento)
                            : 0,

                    descricao: descricao,

                    listaPresentes:
                        document.getElementById("listaPresentes").checked,

                    criadorConvites:
                        document.getElementById("criadorConvites").checked,

                    usuarioId: usuarioAtual.uid,

                    criadoEm: serverTimestamp()

                }

            );


            // ==================================
            // SUCESSO
            // ==================================

            console.log(
                "Evento criado com ID:",
                evento.id
            );


            // Limpar formulário

            formulario.reset();


            // Animação de confirmação e volta para o início

            confirmarENavegar({
                tipo: "evento-criado",
                mensagem: "Evento criado com sucesso!",
                destino: "indexAdmin.html"
            });


        }


        catch (erro) {


            console.error(
                "Erro ao criar evento:",
                erro
            );


            mensagem.textContent =
                "Erro ao criar evento: " +
                erro.message;


            mensagem.style.color =
                "red";


            botaoCriar.disabled = false;

            botaoCriar.textContent =
                "Criar Evento";

        }

    });


</script>


</body>

</html>
