
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PlanNexus</title>
    <link rel="icon" href="fotos/logo.png">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/carrossel.css"
    >

    <!-- PWA: manifest, cor do tema e service worker -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5A32D3">
    <script src="js/versaoApp.js"></script>
    <script src="js/pwa.js" defer></script>
    <link rel="stylesheet" href="css/transicao.css">
    <script src="js/splash.js"></script>
    <link rel="stylesheet" href="css/responsivo.css">
    <link rel="stylesheet" href="css/acessibilidade.css">
    <script src="js/preferencias.js"></script>
</head>

<body>

    <!-- Vídeo de abertura (animacoes/intro.mp4). Toca ao abrir o app e, quando termina
         (ou se o usuário der 2 toques para acelerar), segue o fluxo normal abaixo:
         logado -> inicio.html | não logado -> carrossel.
         Toca 1 vez por sessão, então voltar para esta tela não repete o vídeo. -->
    <script>
        window.splashFim = false;
        window.aoFimDoSplash = null;
        (function () {
            var jaViu = false;
            try { jaViu = sessionStorage.getItem("splashVisto") === "1"; } catch (e) {}

            function fim() {
                window.splashFim = true;
                try { sessionStorage.setItem("splashVisto", "1"); } catch (e) {}
                if (typeof window.aoFimDoSplash === "function") window.aoFimDoSplash();
            }

            if (jaViu || typeof iniciarSplash !== "function") { window.splashFim = true; return; }
            iniciarSplash({ aoTerminar: fim });
        })();
    </script>

    <!-- Tela de espera: aparece enquanto o app confere se já existe login.
         Quem já está logado vai direto para o início, sem ver o carrossel. -->
    <div class="splash-inicio" aria-hidden="true">
        <img src="fotos/logo.png" alt="">
    </div>

    <div class="onboarding">

        <div class="slides" id="slides">

            <section class="slide">

                <div
                    class="fundo"
                    style="background-image: url('fotos/fundo1.jpg');"
                ></div>

                <div class="overlay"></div>

                <div class="conteudo">

                    <div class="logo">
                        <img src="fotos/logo.png" alt="PlanNexus">
                    </div>

                    <h1>
                        Bem Vindo(a) ao<br>
                        Plannexus
                    </h1>

                    <p>
                        O app que irá te ajudar<br>
                        a organizar sua festa,<br>
                        evento ou projeto ideal.
                    </p>

                </div>

            </section>

            <section class="slide">

                <div
                    class="fundo"
                    style="background-image: url('fotos/fundo2.jpg');"
                ></div>

                <div class="overlay"></div>

                <div class="conteudo">

                    <div class="imagem-explicacao">

                        <i class="fa-regular fa-calendar-days"></i>

                        <span>
                            ORGANIZE
                        </span>

                    </div>

                    <h1>
                        Planeje tudo<br>
                        em um só lugar
                    </h1>

                    <p>
                        Organize datas, tarefas,<br>
                        fornecedores e todos os<br>
                        detalhes do seu evento.
                    </p>

                </div>

            </section>

            <section class="slide">

                <div
                    class="fundo"
                    style="background-image: url('fotos/fundo3.jpg');"
                ></div>

                <div class="overlay"></div>

                <div class="conteudo">

                    <div class="logo">
                        <img src="fotos/logo.png" alt="PlanNexus">
                    </div>

                    <h1>
                        Crie sua conta e<br>
                        comece seu<br>
                        planejamento!
                    </h1>

                    <button
                        class="btn-entrar"
                        onclick="entrar()"
                    >
                        Entrar
                    </button>

                    <p class="cadastro">
                        Novo usuário?
                        <a href="cadastro.html">
                            Crie uma conta
                        </a>
                    </p>

                </div>

            </section>

        </div>

        <button
            class="seta esquerda"
            id="prev"
            onclick="anterior()"
        >
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <button
            class="seta direita"
            id="next"
            onclick="proxima()"
        >
            <i class="fa-solid fa-chevron-right"></i>
        </button>

        <div class="indicadores">

            <span
                class="bolinha ativa"
                onclick="irPara(0)"
            ></span>

            <span
                class="bolinha"
                onclick="irPara(1)"
            ></span>

            <span
                class="bolinha"
                onclick="irPara(2)"
            ></span>

        </div>

    </div>

    <script src="js/config.js"></script>
    <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    // FIREBASE_CONFIG vem do arquivo js/config.js
    const app  = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);

        const slides = document.getElementById("slides");
        const bolinhas = document.querySelectorAll(".bolinha");

        const totalSlides = 3;
        let slideAtual = 0;

        function atualizarCarrossel() {
            slides.style.transform =
                `translateX(-${slideAtual * 100}%)`;

            bolinhas.forEach((bolinha, index) => {
                bolinha.classList.toggle(
                    "ativa",
                    index === slideAtual
                );
            });
        }

        function proxima() {
            if (slideAtual < totalSlides - 1) {
                slideAtual++;
            }

            atualizarCarrossel();
        }

        function anterior() {
            if (slideAtual > 0) {
                slideAtual--;
            }

            atualizarCarrossel();
        }

        function irPara(numero) {
            slideAtual = numero;
            atualizarCarrossel();
        }

        function entrar() {
            window.location.href = "login.html";
        }

        let inicioX = 0;
        let fimX = 0;

        slides.addEventListener(
            "touchstart",
            function(event) {
                inicioX = event.touches[0].clientX;
            }
        );

        slides.addEventListener(
            "touchend",
            function(event) {
                fimX = event.changedTouches[0].clientX;

                const distancia = fimX - inicioX;

                if (Math.abs(distancia) > 50) {

                    if (distancia < 0) {
                        proxima();
                    } else {
                        anterior();
                    }

                }
            }
        );

        atualizarCarrossel();

        // Só mostra o carrossel depois de saber que NÃO há ninguém logado.
        function mostrarCarrossel() {
            document.body.classList.add("pronto");
        }

        onAuthStateChanged(
            auth,
            (usuario) => {

                if (usuario) {
                    // replace: o botão "voltar" não traz o usuário de volta para esta tela
                    // Se o vídeo de abertura ainda está tocando, espera ele terminar.
                    const irParaInicio = () => window.location.replace("inicio.html");

                    if (window.splashFim) {
                        irParaInicio();
                    } else {
                        window.aoFimDoSplash = irParaInicio;
                    }
                } else {
                    mostrarCarrossel();
                }

            }
        );

        // Segurança: se o Firebase demorar (rede ruim), não deixa a tela presa.
        setTimeout(mostrarCarrossel, 4000);

        window.proxima = proxima;
        window.anterior = anterior;
        window.irPara = irPara;
        window.entrar = entrar;

    </script>

</body>

</html>
