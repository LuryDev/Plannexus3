<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calendário - Plannexus</title>
    <link rel="icon" href="fotos/logo.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/calendario.css">
    <link rel="stylesheet" href="css/escuro/calendario.css">

    <!-- PWA: manifest, cor do tema e service worker -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5A32D3">
    <script src="js/pwa.js" defer></script>
    <link rel="stylesheet" href="css/nexusFlutuante.css">
    <link rel="stylesheet" href="css/escuro/nexusFlutuante.css">
    <link rel="stylesheet" href="css/responsivo.css">
    <link rel="stylesheet" href="css/acessibilidade.css">
    <link rel="stylesheet" href="css/temaEscuro.css">
    <script src="js/preferencias.js"></script>
</head>

<body>

    <div class="app">

        <header>
            <a class="voltar" id="voltar" href="evento.html" title="Voltar" aria-label="Voltar">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <h1 id="nomeEvento">Carregando...</h1>
        </header>

        <main class="calendario-container">

            <div class="titulo">
                <h2>Calendário do Evento</h2>

                <button class="novo" id="botaoNovo" type="button">
                    <i class="fa-solid fa-plus"></i>
                    Novo
                </button>
            </div>

            <section class="contagem reinverter" id="contagem" aria-live="off" hidden>
                <p class="contagem-rotulo" id="contagemRotulo">Próximo compromisso</p>
                <h3 class="contagem-titulo" id="contagemTitulo"></h3>
                <div class="contagem-tempo" id="contagemTempo" role="timer"></div>
                <p class="contagem-quando" id="contagemQuando"></p>
            </section>

            <section class="cal" id="cal" aria-label="Calendário">
                <div class="cal-topo">
                    <button type="button" class="cal-nav" id="mesAnterior" aria-label="Mês anterior">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <button type="button" class="cal-mes" id="calMes" title="Voltar para o mês de hoje"></button>
                    <button type="button" class="cal-nav" id="mesSeguinte" aria-label="Próximo mês">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
                <div class="cal-semana" aria-hidden="true">
                    <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
                </div>
                <div class="cal-grade" id="calGrade"></div>
                <p class="cal-legenda"><span class="ponto reinverter"></span> Dia com compromisso</p>
            </section>

            <div class="filtro-dia" id="filtroDia" hidden>
                <span id="filtroDiaTexto"></span>
                <button type="button" id="verTodos">Ver todos</button>
            </div>

            <section class="lista-compromissos" id="listaCompromissos">
                <p class="aviso">Carregando agenda...</p>
            </section>

        </main>

    </div>

    <div class="modal" id="modal" hidden>

        <form class="modal-caixa" id="formCompromisso">

            <div class="modal-topo">
                <h2>Novo compromisso</h2>

                <button type="button" class="fechar" id="fecharModal" title="Fechar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <label for="tituloCompromisso">Título</label>
            <input
                type="text"
                id="tituloCompromisso"
                placeholder="Ex: Prova do bolo"
                maxlength="80"
                required
            >

            <div class="duplo">
                <div>
                    <label for="dataCompromisso">Data</label>
                    <input type="date" id="dataCompromisso" required>
                </div>

                <div>
                    <label for="horarioCompromisso">Horário</label>
                    <input type="time" id="horarioCompromisso">
                </div>
            </div>

            <label for="descricaoCompromisso">Descrição</label>
            <textarea
                id="descricaoCompromisso"
                rows="3"
                placeholder="Detalhes (opcional)"
            ></textarea>

            <button type="submit" class="salvar" id="botaoSalvar">
                Salvar compromisso
            </button>

            <p class="mensagem" id="mensagem"></p>

        </form>

    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script type="module" src="js/calendario.js"></script>


    <!-- Nexus flutuante: assistente de ajuda -->
    <script type="module" src="js/nexusFlutuante.js"></script>

</body>
</html>
