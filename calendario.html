
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário | PlanNexus</title>
    <link rel="stylesheet" href="css/calendario.css">
</head>
<body>
    <header>
        <h1 id="nomeEvento">Carregando evento...</h1>
    </header>

    <main>
        <section aria-labelledby="tituloCalendario">
            <div id="avisoEvento" class="aviso-evento" role="status" aria-live="polite"></div>
            <h2 id="tituloCalendario">Compromissos</h2>

            <button type="button" id="botaoNovo">
                Novo compromisso
            </button>

            <p id="mensagem" role="status" aria-live="polite"></p>

            <section
                id="listaCompromissos"
                class="lista-compromissos"
                aria-label="Lista de compromissos"
            ></section>
        </section>
    </main>

    <div id="modal" role="dialog"
         aria-modal="true"
         aria-labelledby="tituloModal"
         style="display: none;">

        <div class="conteudo-modal">
            <h2 id="tituloModal">Novo compromisso</h2>

            <form id="formCompromisso">
                <label for="tituloCompromisso">
                    Título
                </label>
                <input
                    type="text"
                    id="tituloCompromisso"
                    maxlength="120"
                    required
                >

                <label for="dataCompromisso">
                    Data
                </label>
                <input
                    type="date"
                    id="dataCompromisso"
                    required
                >

                <label for="horarioCompromisso">
                    Horário
                </label>
                <input
                    type="time"
                    id="horarioCompromisso"
                    required
                >

                <label for="localCompromisso">Local</label>
                <input type="text" id="localCompromisso" maxlength="150">

                <label for="responsaveisCompromisso">Responsáveis</label>
                <input
                    type="text"
                    id="responsaveisCompromisso"
                    maxlength="300"
                    placeholder="Ex.: Ana, Pedro, Júlia"
                >

                <label for="descricaoCompromisso">
                    Descrição
                </label>
                <textarea
                    id="descricaoCompromisso"
                    maxlength="2000"
                    rows="4"
                ></textarea>

                <div class="acoes-modal">
                    <button type="submit" id="botaoSalvar">
                        Salvar compromisso
                    </button>

                    <button type="button" id="fecharModal">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="modalConfirmacao" class="modal" style="display: none;">
    <div class="conteudo-modal">
        <h2>Confirmar exclusão</h2>

        <p>Tem certeza de que deseja excluir este compromisso?</p>

        <div class="acoes-modal">
            <button type="button" id="cancelarExclusao">
                Cancelar
            </button>

            <button type="button" id="confirmarExclusao">
                Confirmar exclusão
            </button>
        </div>
    </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script type="module" src="js/calendario.js"></script>
</body>
</html>
