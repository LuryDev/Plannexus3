<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Veja seus convites e avisos no PlanNexus.">
    <title>Notificações | PlanNexus</title>
    <link rel="icon" href="fotos/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/notificacoes.css">

    <!-- PWA: manifest, cor do tema e service worker -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5A32D3">
    <script src="js/pwa.js" defer></script>
</head>

<body>
<div class="container">

    <header>
        <a href="inicio.html" class="voltar" title="Voltar">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2>Notificações</h2>
    </header>

    <main class="paginaNotificacoes">

        <section>
            <h3>Convites</h3>
            <div id="listaConvites">
                <p class="estado-notificacoes">Carregando...</p>
            </div>
        </section>

        <section>
            <h3>Avisos</h3>
            <div id="listaAvisos">
                <p class="estado-notificacoes">Carregando...</p>
            </div>
        </section>

        <section>
            <h3>Notificações no celular</h3>
            <div class="cartao-push" id="cartaoPush">
                <p id="textoPush">Receba os avisos mesmo com o app fechado.</p>
                <button type="button" class="btn-push" id="botaoPush">Ativar notificações</button>
                <p class="estado-notificacoes" id="erroPush"></p>
                <p class="dica-atualizar" id="dicaAtualizar" hidden>
                    Está usando o app da Play Store? Atualize o Plannexus pela
                    <a href="https://play.google.com/store/apps/details?id=com.lurydev.plannexus">Play Store</a>
                    e tente de novo. As notificações precisam da versão mais recente.
                </p>
            </div>
        </section>

        <section>
            <h3>Quais avisos você quer receber?</h3>
            <div class="preferencias" id="preferencias">
                <label><input type="checkbox" data-categoria="colaboracao"> Atividade de colaboradores (adicionar, remover, comentar)</label>
                <label><input type="checkbox" data-categoria="contagem"> Contagem regressiva do evento</label>
                <label><input type="checkbox" data-categoria="tarefas"> Prazos de tarefas</label>
                <label><input type="checkbox" data-categoria="calendario"> Compromissos do calendário</label>
                <label><input type="checkbox" data-categoria="orcamento"> Orçamento (80% e 100% gasto)</label>
                <label><input type="checkbox" data-categoria="dicas"> Dicas do Nexus</label>
            </div>
        </section>

    </main>

</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import {
        getFirestore,
        collection,
        doc,
        query,
        where,
        getDocs,
        updateDoc,
        setDoc,
        deleteDoc,
        addDoc,
        writeBatch,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    import { pushDisponivel, motivoIndisponivel, pushAtivo, ativarPush, desativarPush, notificarServidor } from "./js/push.js";
    import { mensagemColaboracao, paginaDaFerramenta, categoriaDoAviso, carregarDesligadas } from "./js/avisos.js";

    const app = initializeApp(window.FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const listaConvites = document.getElementById("listaConvites");
    const listaAvisos = document.getElementById("listaAvisos");

    let usuarioAtual = null;
    let desligadas = [];

    function papelLegivel(papel) {
        if (papel === "colaborador") return "Colaborador";
        if (papel === "visitante") return "Visitante";
        return papel;
    }

    function cartaoConvite(documento) {
        const convite = documento.data();

        return `
            <div class="convite-card" data-id="${documento.id}">
                <p>
                    Você foi convidado(a) para o evento
                    <strong>${escaparHTML(convite.eventoNome || "Evento sem nome")}</strong>
                    como <strong>${escaparHTML(papelLegivel(convite.papel))}</strong>.
                </p>
                <div class="convite-acoes">
                    <button type="button" class="btn-aceitar" data-id="${documento.id}" data-acao="aceitar">Aceitar</button>
                    <button type="button" class="btn-recusar" data-id="${documento.id}" data-acao="recusar">Recusar</button>
                </div>
            </div>
        `;
    }

    async function carregarConvites() {
        try {
            const consulta = query(
                collection(db, "convites"),
                where("emailConvidado", "==", usuarioAtual.email),
                where("status", "==", "pendente")
            );

            const resultado = await getDocs(consulta);

            if (resultado.empty) {
                listaConvites.innerHTML = '<p class="estado-notificacoes">Nenhum convite pendente.</p>';
                return;
            }

            const convitesPorId = new Map();
            resultado.forEach((documento) => convitesPorId.set(documento.id, documento.data()));

            listaConvites.innerHTML = resultado.docs.map(cartaoConvite).join("");

            listaConvites.querySelectorAll("[data-acao]").forEach((botao) => {
                botao.addEventListener("click", () => {
                    const conviteId = botao.dataset.id;
                    const aceitar = botao.dataset.acao === "aceitar";
                    responderConvite(conviteId, convitesPorId.get(conviteId), aceitar);
                });
            });

        } catch (erro) {
            console.error("Erro ao carregar convites:", erro);
            listaConvites.innerHTML = '<p class="estado-notificacoes">Não foi possível carregar os convites.</p>';
        }
    }

    async function responderConvite(conviteId, convite, aceitar) {
        if (!convite || !usuarioAtual) return;

        const cartao = listaConvites.querySelector(`[data-id="${conviteId}"].convite-card`);
        if (cartao) {
            cartao.querySelectorAll("button").forEach((botao) => botao.disabled = true);
        }

        try {
            const referenciaConvite = doc(db, "convites", conviteId);

            if (aceitar) {
                const referenciaMembro = doc(db, "eventos", convite.eventoId, "membros", usuarioAtual.uid);
                const referenciaPerfil = doc(db, "usuarios", usuarioAtual.uid);

                const lote = writeBatch(db);

                lote.set(referenciaMembro, {
                    uid: usuarioAtual.uid,
                    email: usuarioAtual.email,
                    papel: convite.papel,
                    conviteId: conviteId,
                    dataEntrada: serverTimestamp()
                });

                lote.update(referenciaConvite, {
                    status: "aceito",
                    dataResposta: serverTimestamp()
                });

                lote.set(referenciaPerfil, {
                    eventosCompartilhados: {
                        [convite.eventoId]: convite.papel
                    }
                }, { merge: true });

                await lote.commit();

                // avisa o dono do evento (separado: se falhar, o convite continua aceito)
                if (convite.donoId) {
                    try {
                        await addDoc(collection(db, "avisos"), {
                            tipo: "aceitou-convite",
                            uid: convite.donoId,
                            eventoId: convite.eventoId,
                            mensagem: `${usuarioAtual.displayName || usuarioAtual.email} aceitou seu convite e agora é ${papelLegivel(convite.papel).toLowerCase()} do evento "${convite.eventoNome || "Evento sem nome"}".`,
                            lida: false,
                            dataCriacao: serverTimestamp()
                        });
                    } catch (erroAviso) {
                        console.warn("Não foi possível avisar o dono:", erroAviso);
                    }
                }

                notificarServidor(usuarioAtual, {
                    tipo: "aceitou",
                    conviteId,
                    autorNome: usuarioAtual.displayName || usuarioAtual.email
                });
            } else {
                await updateDoc(referenciaConvite, {
                    status: "recusado",
                    dataResposta: serverTimestamp()
                });
            }

            await carregarConvites();

        } catch (erro) {
            console.error("Erro ao responder convite:", erro);
            alert("Não foi possível responder o convite. Tente novamente.");
            if (cartao) {
                cartao.querySelectorAll("button").forEach((botao) => botao.disabled = false);
            }
        }
    }

    function cartaoAviso(documento) {
        const aviso = documento.data();
        const texto = aviso.tipo === "colaboracao" ? mensagemColaboracao(aviso) : (aviso.mensagem || "");
        const link = (aviso.tipo === "colaboracao" || aviso.tipo === "lembrete") && aviso.eventoId
            ? `<a class="btn-ver-aviso" href="${escaparHTML(paginaDaFerramenta(aviso.ferramenta, aviso.eventoId))}">Ver</a>`
            : "";

        return `
            <div class="aviso-card" data-id="${documento.id}">
                <p>${escaparHTML(texto)}</p>
                ${link}
                <button type="button" class="btn-marcar-lido" data-id="${documento.id}" data-tipo="${escaparHTML(aviso.tipo || "")}">Marcar como lido</button>
            </div>
        `;
    }

    async function carregarAvisos() {
        try {
            const consulta = query(
                collection(db, "avisos"),
                where("uid", "==", usuarioAtual.uid),
                where("lida", "==", false)
            );

            const resultadoBruto = await getDocs(consulta);

            // esconde as categorias que o usuário desligou
            const visiveis = resultadoBruto.docs.filter((d) => !desligadas.includes(categoriaDoAviso(d.data())));
            const resultado = { empty: visiveis.length === 0, docs: visiveis };

            if (resultado.empty) {
                listaAvisos.innerHTML = '<p class="estado-notificacoes">Nenhum aviso novo.</p>';
                return;
            }

            listaAvisos.innerHTML = resultado.docs.map(cartaoAviso).join("");

            listaAvisos.querySelectorAll(".btn-marcar-lido").forEach((botao) => {
                botao.addEventListener("click", async () => {
                    botao.disabled = true;
                    try {
                        // avisos de colaboração somem ao serem lidos (a contagem recomeça)
                        if (botao.dataset.tipo === "colaboracao") {
                            await deleteDoc(doc(db, "avisos", botao.dataset.id));
                        } else {
                            await updateDoc(doc(db, "avisos", botao.dataset.id), { lida: true });
                        }
                        await carregarAvisos();
                    } catch (erro) {
                        console.error("Erro ao marcar aviso como lido:", erro);
                        botao.disabled = false;
                    }
                });
            });

        } catch (erro) {
            console.error("Erro ao carregar avisos:", erro);
            listaAvisos.innerHTML = '<p class="estado-notificacoes">Não foi possível carregar os avisos.</p>';
        }
    }

    function montarPush() {
        const botao = document.getElementById("botaoPush");
        const texto = document.getElementById("textoPush");
        const erro = document.getElementById("erroPush");
        const dica = document.getElementById("dicaAtualizar");

        function atualizar() {
            if (!pushDisponivel()) {
                const motivo = motivoIndisponivel();

                texto.textContent = motivo === "chave"
                    ? "As notificações ainda não foram configuradas no servidor do Plannexus (falta a chave VAPID_KEY)."
                    : "Este aparelho ou esta versão do app não aceita notificações push.";
                botao.hidden = true;
                dica.hidden = motivo === "chave";   // atualizar o app só ajuda no caso do aparelho
                return;
            }

            if (pushAtivo()) {
                texto.textContent = "As notificações estão ativadas neste aparelho. ✅";
                botao.textContent = "Desativar";
            } else {
                texto.textContent = "Receba os avisos mesmo com o app fechado.";
                botao.textContent = "Ativar notificações";
            }
        }

        botao.addEventListener("click", async () => {
            botao.disabled = true;
            erro.textContent = "";

            try {
                if (pushAtivo()) await desativarPush(db, usuarioAtual);
                else await ativarPush(db, usuarioAtual);
            } catch (e) {
                console.error(e);
                erro.textContent = (e.message || "Não foi possível alterar.") +
                    " [" + (e.name || "erro") + " · chave: " + String(window.VAPID_KEY || "").length + " caracteres]";
                dica.hidden = false;   // pode ser um app desatualizado
            }

            botao.disabled = false;
            atualizar();
        });

        atualizar();
    }

    function montarPreferencias() {
        const caixas = document.querySelectorAll("#preferencias input[data-categoria]");

        caixas.forEach((caixa) => {
            caixa.checked = !desligadas.includes(caixa.dataset.categoria);

            caixa.addEventListener("change", async () => {
                desligadas = [...caixas].filter((c) => !c.checked).map((c) => c.dataset.categoria);

                try {
                    await setDoc(doc(db, "usuarios", usuarioAtual.uid), { avisosDesligados: desligadas }, { merge: true });
                    carregarAvisos();
                } catch (erro) {
                    console.error("Erro ao salvar preferências:", erro);
                    alert("Não foi possível salvar sua preferência.");
                    caixa.checked = !caixa.checked;
                }
            });
        });
    }

    onAuthStateChanged(auth, (usuario) => {
        if (!usuario) {
            window.location.href = "login.html";
            return;
        }

        usuarioAtual = usuario;
        carregarConvites();

        carregarDesligadas(db, usuario.uid).then((lista) => {
            desligadas = lista;
            montarPreferencias();
            montarPush();
            carregarAvisos();
        });
    });
</script>

</body>
</html>
