<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | PlanNexus</title>
    <link rel="icon" href="fotos/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/nexus.css">
    <link rel="stylesheet" href="css/nexusFlutuante.css">

    <!-- PWA: manifest, cor do tema e service worker -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5A32D3">
    <script src="js/pwa.js" defer></script>
    <link rel="stylesheet" href="css/transicao.css">
    <script src="js/transicao.js" defer></script>
    <link rel="stylesheet" href="css/responsivo.css">
</head>

<body>

    <div class="app">

        <header>
            <a class="voltar" href="inicio.html" title="Voltar" aria-label="Voltar para o início">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <img class="avatar" src="fotos/mascote.png" alt="Nexus">

            <div class="titulo-header">
                <h1>Nexus</h1>
                <span>Assistente de eventos</span>
            </div>
        </header>

        <!-- CONVERSA (preenchida pelo JavaScript) -->
        <main class="conversa" id="conversa" aria-live="polite"></main>

        <!-- RESUMO DO EVENTO (aparece quando o Nexus junta os dados) -->
        <section class="resumo-evento" id="resumoEvento" hidden>
            <h2>Confira seu evento</h2>
            <div id="dadosResumo"></div>

            <div id="blocoTarefas" hidden>
                <h3>Tarefas sugeridas</h3>
                <div id="listaTarefasSugeridas"></div>
            </div>

            <button type="button" class="botao-criar" id="botaoCriar">
                <i class="fa-solid fa-check"></i>
                Criar evento
            </button>
            <p class="mensagem" id="mensagemCriar"></p>
        </section>

        <!-- CAMPO DE MENSAGEM -->
        <form class="barra-mensagem" id="formMensagem" autocomplete="off">
            <input type="text" id="campoMensagem" placeholder="Fale sobre o seu evento..." maxlength="500" aria-label="Mensagem">
            <button type="submit" id="botaoEnviar" title="Enviar" aria-label="Enviar">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>

        <p class="aviso-ia">O Nexus usa inteligência artificial e pode errar. Confira os dados antes de criar o evento.
            <a href="feedback.html">Denunciar uma resposta</a></p>

    </div>

    <!-- POP-UP das perguntas opcionais -->
    <div class="fundo-pop" id="fundoPop" role="dialog" aria-modal="true" aria-labelledby="perguntaPop">
        <div class="pop">
            <div class="topo">
                <img src="fotos/mascote.png" alt="">
                <div><b>Pergunta opcional</b><span id="contadorPop"></span></div>
            </div>
            <h3 id="perguntaPop"></h3>
            <textarea id="respostaPop" maxlength="300" placeholder="Escreva aqui... (pode deixar em branco)"></textarea>
            <div class="rodape-pop"><span>Fica salvo no bloco de notas do evento.</span><span id="caracteresPop">0/300</span></div>
            <div class="botoes-pop">
                <button type="button" class="b-secundario" id="cancelarPop" style="color:#5A32D3;background:#F1EEFB">Agora não</button>
                <button type="button" id="salvarPop" style="color:#fff;background:linear-gradient(135deg,#5A32D3,#4D2FB8)">Salvar resposta</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/icones.js"></script>
    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { anexarReporte } from "./js/reportarResposta.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        // FIREBASE_CONFIG vem do arquivo js/config.js
        const app  = initializeApp(FIREBASE_CONFIG);
        const auth = getAuth(app);
        const db   = getFirestore(app);


        // ================= ELEMENTOS =================
        const conversaEl     = document.getElementById("conversa");
        const formEl         = document.getElementById("formMensagem");
        const campoEl        = document.getElementById("campoMensagem");
        const botaoEnviar    = document.getElementById("botaoEnviar");
        const resumoEl       = document.getElementById("resumoEvento");
        const dadosResumoEl  = document.getElementById("dadosResumo");
        const blocoTarefasEl = document.getElementById("blocoTarefas");
        const listaTarefasEl = document.getElementById("listaTarefasSugeridas");
        const botaoCriar     = document.getElementById("botaoCriar");
        const mensagemCriar  = document.getElementById("mensagemCriar");

        let usuarioAtual = null;
        let historico = [];        // [{ role: "user" | "model", text }]
        let eventoAtual = null;    // evento proposto pelo Nexus
        let tarefasAtuais = [];    // tarefas sugeridas
        let aguardando = false;

        // ----- etapa extra: 2 perguntas opcionais + escolha das ferramentas -----
        let extrasFeitos = false;           // já passou pelas perguntas e pela escolha?
        let extrasEmAndamento = false;
        let respostasExtras = [];           // [{ pergunta, resposta }]
        let escolhas = { listaPresentes: false, criadorConvites: false };

        // 2 perguntas opcionais por tipo de evento
        const PERGUNTAS_EXTRAS = {
            "Casamento":          ["Vocês já têm um estilo ou paleta de cores em mente?", "Quantos padrinhos e madrinhas terão na cerimônia?"],
            "Aniversário":        ["Qual é o tema da festa (se tiver um)?", "Quantos anos o aniversariante vai fazer?"],
            "Formatura":          ["Qual é o curso e a instituição da turma?", "Vai ter baile ou só a colação de grau?"],
            "Evento Corporativo": ["Qual é o objetivo do evento (treinamento, confraternização, lançamento)?", "Vai precisar de palestrante ou equipamentos (projetor, som)?"],
            "Chá de Bebê":        ["Já sabem o sexo do bebê ou será surpresa?", "Vai ter algum tema ou cor para a decoração?"],
            "Outro":              ["Qual é o principal objetivo do evento?", "Tem alguma exigência especial (acessibilidade, restrição alimentar)?"]
        };


        // ================= MENSAGENS NA TELA =================
        function adicionarBalao(texto, quem, erro = false) {
            const balao = document.createElement("div");
            balao.className = "balao " + (quem === "usuario" ? "balao-usuario" : "balao-nexus") + (erro ? " balao-erro" : "");
            balao.textContent = texto;
            conversaEl.appendChild(balao);
            conversaEl.scrollTop = conversaEl.scrollHeight;
            return balao;
        }

        function mostrarDigitando() {
            const balao = document.createElement("div");
            balao.className = "balao balao-nexus digitando";
            balao.innerHTML = "<span></span><span></span><span></span>";
            conversaEl.appendChild(balao);
            conversaEl.scrollTop = conversaEl.scrollHeight;
            return balao;
        }

        // ================= RESUMO DO EVENTO =================
        function linhaResumo(rotulo, valor) {
            return `<div class="linha-resumo"><span>${escaparHTML(rotulo)}</span><strong>${escaparHTML(valor)}</strong></div>`;
        }

        function desenharResumo() {

            if (!eventoAtual) {
                resumoEl.hidden = true;
                return;
            }

            const e = eventoAtual;

            let html = `
                <div class="resumo-topo">
                    <div class="resumo-icone"><i class="${iconeDoEvento(e.categoria)}"></i></div>
                    <strong>${escaparHTML(e.nome)}</strong>
                </div>
            `;

            html += linhaResumo("Tipo", e.categoria);
            html += linhaResumo("Data", formatarData(e.data));
            html += linhaResumo("Horário", e.horario);
            html += linhaResumo("Local", e.local);
            if (e.convidados > 0) html += linhaResumo("Convidados", e.convidados);
            if (e.orcamento > 0) html += linhaResumo("Orçamento", Number(e.orcamento).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }));
            if (e.descricao) html += linhaResumo("Descrição", e.descricao);
            if (escolhas.listaPresentes) html += linhaResumo("Lista de presentes", "Sim");
            if (escolhas.criadorConvites) html += linhaResumo("Criador de convites", "Sim");
            if (respostasExtras.length) html += linhaResumo("Notas do evento", respostasExtras.length + (respostasExtras.length === 1 ? " resposta" : " respostas"));

            dadosResumoEl.innerHTML = html;

            if (tarefasAtuais.length) {
                listaTarefasEl.innerHTML = tarefasAtuais.map((t, i) => `
                    <label class="tarefa-sugerida">
                        <input type="checkbox" data-indice="${i}" checked>
                        <span>
                            ${escaparHTML(t.titulo)}
                            ${t.servico ? '<small class="selo-servico"><i class="fa-solid fa-circle-check"></i> Plannexus oferece esse serviço!</small>' : ""}
                        </span>
                    </label>
                `).join("");
                blocoTarefasEl.hidden = false;
            } else {
                blocoTarefasEl.hidden = true;
            }

            resumoEl.hidden = false;
            conversaEl.scrollTop = conversaEl.scrollHeight;
        }


        // ================= ENVIAR PARA O NEXUS =================
        async function enviarMensagem(texto) {

            if (aguardando || !usuarioAtual) return;

            aguardando = true;
            botaoEnviar.disabled = true;

            adicionarBalao(texto, "usuario");
            historico.push({ role: "user", text: texto });

            const digitando = mostrarDigitando();

            try {
                const token = await usuarioAtual.getIdToken();

                const resposta = await fetch("/api/nexus", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({ mensagens: historico })
                });

                const dados = await resposta.json().catch(() => ({}));

                digitando.remove();

                if (!resposta.ok) {
                    historico.pop();   // essa mensagem não foi processada
                    adicionarBalao((dados.erro || "O Nexus não conseguiu responder agora.") + (dados.codigo ? " (código " + dados.codigo + ")" : ""), "nexus", true);
                    return;
                }

                historico.push({ role: "model", text: dados.resposta });
                const balaoResposta = adicionarBalao(dados.resposta, "nexus");
                anexarReporte(balaoResposta, {
                    usuario: usuarioAtual, pergunta: texto, resposta: dados.resposta,
                    origem: "criar evento com o Nexus"
                });

                eventoAtual = dados.evento || null;
                tarefasAtuais = dados.tarefas || [];

                // primeira vez que o evento fica pronto: perguntas opcionais e escolha das ferramentas
                if (eventoAtual && !extrasFeitos && !extrasEmAndamento) {
                    resumoEl.hidden = true;
                    iniciarExtras();
                } else if (!extrasEmAndamento) {
                    desenharResumo();
                }
            }
            catch (erro) {
                console.error("Erro no Nexus:", erro);
                digitando.remove();
                historico.pop();
                adicionarBalao("Não consegui falar com o Nexus. Confira sua internet e tente de novo.", "nexus", true);
            }
            finally {
                aguardando = false;
                botaoEnviar.disabled = false;
                campoEl.focus();
            }
        }

        formEl.addEventListener("submit", (evento) => {
            evento.preventDefault();

            const texto = campoEl.value.trim();
            if (!texto) return;

            campoEl.value = "";
            enviarMensagem(texto);
        });


        // ================= PERGUNTAS OPCIONAIS E FERRAMENTAS =================
        const fundoPop     = document.getElementById("fundoPop");
        const respostaPop  = document.getElementById("respostaPop");
        const perguntaPop  = document.getElementById("perguntaPop");
        const contadorPop  = document.getElementById("contadorPop");
        const caracteresPop = document.getElementById("caracteresPop");

        function adicionarCartao(html) {
            const cartao = document.createElement("div");
            cartao.className = "cartao-extra";
            cartao.innerHTML = html;
            conversaEl.appendChild(cartao);
            conversaEl.scrollTop = conversaEl.scrollHeight;
            return cartao;
        }

        function pausa(ms) {
            return new Promise((ok) => setTimeout(ok, ms));
        }

        // abre o pop-up e devolve o texto digitado ("" se cancelou)
        function perguntarNoPopup(pergunta, numero) {
            return new Promise((resolver) => {
                perguntaPop.textContent = pergunta;
                contadorPop.textContent = "Opcional " + numero + " de 2";
                respostaPop.value = "";
                caracteresPop.textContent = "0/300";
                fundoPop.classList.add("aberto");
                setTimeout(() => respostaPop.focus(), 200);

                function fechar(valor) {
                    fundoPop.classList.remove("aberto");
                    document.getElementById("salvarPop").onclick = null;
                    document.getElementById("cancelarPop").onclick = null;
                    fundoPop.onclick = null;
                    resolver(valor);
                }

                document.getElementById("salvarPop").onclick = () => fechar(respostaPop.value.trim());
                document.getElementById("cancelarPop").onclick = () => fechar("");
                fundoPop.onclick = (e) => { if (e.target === fundoPop) fechar(""); };
            });
        }

        respostaPop.addEventListener("input", () => {
            caracteresPop.textContent = respostaPop.value.length + "/300";
        });

        // mostra uma pergunta como balão com Responder / Pular
        function fazerPerguntaExtra(pergunta, numero) {
            return new Promise((resolver) => {
                const cartao = adicionarCartao(`
                    <small class="selo">Opcional ${numero} de 2</small>
                    <div>${escaparHTML(pergunta)}</div>
                    <div class="acoes">
                        <button type="button" class="b-principal" data-acao="responder"><i class="fa-solid fa-pen"></i> Responder</button>
                        <button type="button" class="b-secundario" data-acao="pular">Pular</button>
                    </div>
                `);

                cartao.querySelector('[data-acao="responder"]').addEventListener("click", async () => {
                    const texto = await perguntarNoPopup(pergunta, numero);
                    if (!texto) return;                       // fechou sem escrever: continua na pergunta
                    cartao.classList.add("feito");
                    adicionarBalao(texto, "usuario");
                    resolver(texto);
                });

                cartao.querySelector('[data-acao="pular"]').addEventListener("click", () => {
                    cartao.classList.add("feito");
                    adicionarBalao("Pular", "usuario");
                    resolver("");
                });
            });
        }

        // checkboxes: lista de presentes e criador de convites
        function escolherFerramentas() {
            return new Promise((resolver) => {
                const cartao = adicionarCartao(`
                    <div>Por fim: quer incluir alguma dessas ferramentas no evento? Marque só o que quiser.</div>
                    <label class="escolha-ferramenta">
                        <input type="checkbox" id="extraPresentes">
                        <div><strong>Lista de presentes</strong><span>Monte e compartilhe uma lista do que você gostaria de ganhar.</span></div>
                    </label>
                    <label class="escolha-ferramenta">
                        <input type="checkbox" id="extraConvites">
                        <div><strong>Criador de convites Plannexus</strong><span>Gera uma imagem de convite com os dados do evento.</span></div>
                    </label>
                    <div class="acoes"><button type="button" class="b-principal" data-acao="continuar">Continuar</button></div>
                `);

                cartao.querySelector('[data-acao="continuar"]').addEventListener("click", () => {
                    const escolha = {
                        listaPresentes: cartao.querySelector("#extraPresentes").checked,
                        criadorConvites: cartao.querySelector("#extraConvites").checked
                    };
                    cartao.classList.add("feito");
                    cartao.querySelectorAll("input").forEach((i) => { i.disabled = true; });

                    const marcadas = [];
                    if (escolha.listaPresentes) marcadas.push("lista de presentes");
                    if (escolha.criadorConvites) marcadas.push("criador de convites");
                    adicionarBalao(marcadas.length ? "Quero: " + marcadas.join(" e ") : "Nenhuma por enquanto", "usuario");

                    resolver(escolha);
                });
            });
        }

        async function iniciarExtras() {
            extrasEmAndamento = true;
            campoEl.disabled = true;
            botaoEnviar.disabled = true;

            try {
                const perguntas = PERGUNTAS_EXTRAS[eventoAtual.categoria] || PERGUNTAS_EXTRAS["Outro"];

                await pausa(300);
                adicionarBalao("Antes de montar o resumo, tenho 2 perguntinhas opcionais sobre o seu evento. Responda só se quiser!", "nexus");

                respostasExtras = [];
                for (let i = 0; i < perguntas.length; i++) {
                    await pausa(300);
                    const resposta = await fazerPerguntaExtra(perguntas[i], i + 1);
                    if (resposta) respostasExtras.push({ pergunta: perguntas[i], resposta });
                }

                await pausa(300);
                escolhas = await escolherFerramentas();

                await pausa(300);
                adicionarBalao(
                    respostasExtras.length
                        ? "Anotei tudo! Vou guardar suas respostas no bloco de notas do evento. Confira o resumo abaixo e é só criar. ✅"
                        : "Perfeito! Confira o resumo abaixo e é só criar. ✅",
                    "nexus"
                );

                extrasFeitos = true;
            }
            finally {
                extrasEmAndamento = false;
                campoEl.disabled = false;
                botaoEnviar.disabled = false;
                desenharResumo();
            }
        }


        // ================= CRIAR O EVENTO =================
        botaoCriar.addEventListener("click", async () => {

            if (!eventoAtual || !usuarioAtual) return;

            botaoCriar.disabled = true;
            botaoCriar.textContent = "Criando evento...";
            mensagemCriar.textContent = "";

            try {
                const e = eventoAtual;

                // tarefas que o usuário deixou marcadas
                const marcadas = [...listaTarefasEl.querySelectorAll("input:checked")]
                    .map((c) => tarefasAtuais[Number(c.dataset.indice)])
                    .filter(Boolean);

                // se ficou uma tarefa de lista de presentes, já liga essa ferramenta no evento
                const comListaPresentes = escolhas.listaPresentes === true ||
                    marcadas.some((t) => t.servico === "presentes");

                const referencia = await addDoc(collection(db, "eventos"), {
                    nome: e.nome,
                    categoria: e.categoria,
                    data: e.data,
                    horario: e.horario,
                    local: e.local,
                    convidados: e.convidados || 0,
                    orcamento: e.orcamento || 0,
                    descricao: e.descricao || "",
                    listaPresentes: comListaPresentes,
                    criadorConvites: escolhas.criadorConvites === true,
                    criadoComNexus: true,
                    usuarioId: usuarioAtual.uid,
                    criadoEm: serverTimestamp()
                });

                // respostas das perguntas opcionais viram uma anotação no bloco de notas
                if (respostasExtras.length) {
                    await addDoc(collection(db, "eventos", referencia.id, "anotacoes"), {
                        titulo: "Detalhes do evento",
                        conteudo: respostasExtras.map((r) => r.pergunta + "\n" + r.resposta).join("\n\n"),
                        dataCriacao: serverTimestamp(),
                        dataAtualizacao: serverTimestamp()
                    });
                }

                await Promise.all(marcadas.map((tarefa) =>
                    addDoc(collection(db, "eventos", referencia.id, "tarefas"), {
                        titulo: tarefa.titulo,
                        servico: tarefa.servico || "",
                        descricao: "",
                        data: "",
                        prioridade: "media",
                        concluida: false,
                        criadoEm: serverTimestamp()
                    })
                ));

                confirmarENavegar({
                    tipo: "evento-criado",
                    mensagem: "Evento criado com sucesso!",
                    destino: "evento.html?id=" + encodeURIComponent(referencia.id)
                });
            }
            catch (erro) {
                console.error("Erro ao criar evento:", erro);
                mensagemCriar.textContent = "Erro ao criar evento: " + erro.message;
                mensagemCriar.style.color = "red";
                botaoCriar.disabled = false;
                botaoCriar.innerHTML = '<i class="fa-solid fa-check"></i> Criar evento';
            }
        });


        // ================= INÍCIO =================
        const usuario = await exigirLogin(auth, onAuthStateChanged);

        if (usuario) {
            usuarioAtual = usuario;

            adicionarBalao("Oi! Eu sou o Nexus 👋 Me conta que evento você quer organizar e eu te ajudo a criar.", "nexus");
        }

    </script>

</body>

</html>
