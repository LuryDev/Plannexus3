<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Plannexus</title>
    <link rel="icon" href="fotos/logo.png">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/autenticacao.css">
    <link rel="stylesheet" href="css/escuro/autenticacao.css">


    <!-- PWA: manifest, cor do tema e service worker -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5A32D3">
    <script src="js/pwa.js" defer></script>
    <link rel="stylesheet" href="css/transicao.css">
    <link rel="stylesheet" href="css/escuro/transicao.css">
    <script src="js/transicao.js" defer></script>
    <link rel="stylesheet" href="css/responsivo.css">
    <link rel="stylesheet" href="css/acessibilidade.css">
    <link rel="stylesheet" href="css/temaEscuro.css">
    <script src="js/preferencias.js"></script>
</head>

<body>

<div class="tela" id="caixa">

    <div class="topo">
        <div class="marca"><img src="fotos/logo.png" alt=""> Plannexus</div>
        <div class="textos">
            <h1>Bem-vindo(a) de volta!</h1>
            <p>Entre para continuar organizando seus eventos.</p>
        </div>
        <img class="mascote" src="fotos/piscando.png" alt="">
    </div>

    <div class="cartao">

        <div class="abas"><a href="login.html" class="on" aria-current="page">Entrar</a><a href="cadastro.html">Criar conta</a></div>

        <form id="loginForm">
            <label for="email">E-mail</label>
            <div class="campo"><input type="email" id="email" placeholder="voce@email.com" autocomplete="email" required></div>

            <label for="senha">Senha</label>
            <div class="campo"><input type="password" id="senha" class="com-botao" placeholder="Sua senha" autocomplete="current-password" required><button type="button" class="ver" data-v="senha">Mostrar</button></div>

            <button type="submit" id="enter" class="pri">Entrar</button>
        </form>

        <div class="ou">ou</div>

        <button type="button" id="googleLogin" class="google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.7-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20h-.0H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.7-.4-3.9z"/></svg>Continuar com Google</button>

        <p class="aceite">Ao entrar na conta, você concorda com as nossas <a href="privacidade.html" target="_blank" rel="noopener">políticas de privacidade</a>.</p>

        <p id="mensagem" role="alert"></p>

    </div>

</div>

<script src="js/config.js"></script>
<script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { initializeAuth, browserLocalPersistence, indexedDBLocalPersistence, browserPopupRedirectResolver, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    // FIREBASE_CONFIG vem do arquivo js/config.js
    const app  = initializeApp(FIREBASE_CONFIG);
    const auth = initializeAuth(app, {
        persistence: [browserLocalPersistence, indexedDBLocalPersistence],
        popupRedirectResolver: browserPopupRedirectResolver
    });
    const db   = getFirestore(app);

const provider = new GoogleAuthProvider();

    // Dentro do app Android (WebView/TWA) o IndexedDB pode ser fechado enquanto a janela do Google abre
    // ("Database is closing/hidden"). Por isso a sessão fica no localStorage (primeiro da lista) e,
    // se mesmo assim o erro aparecer, usamos o usuário que já entrou ou tentamos mais uma vez.
    async function entrarComGoogle() {
        try {
            return await signInWithPopup(auth, provider);
        } catch (erro) {
            if (/closing|hidden|IndexedDB|Database/i.test((erro && erro.message) || "")) {
                if (auth.currentUser) return { user: auth.currentUser };
                await new Promise((r) => setTimeout(r, 700));
                if (auth.currentUser) return { user: auth.currentUser };
                return await signInWithPopup(auth, provider);
            }
            throw erro;
        }
    }


const formulario = document.getElementById("loginForm");

const mensagem = document.getElementById("mensagem");


formulario.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const senha =
        document.getElementById("senha").value;

    if (email.toLowerCase() === EMAIL_ADMIN.toLowerCase()) {

        mensagem.textContent =
            "Administradores devem entrar pela página de administrador.";

        return;

    }

    try {

        const resultado =
            await signInWithEmailAndPassword(
                auth,
                email,
                senha
            );

        console.log("Usuário logado:", resultado.user);

        console.log("UID:", resultado.user.uid);

        confirmarENavegar({
            tipo: "login",
            mensagem: "Login realizado!",
            destino: "inicio.html"
        });

    }

    catch (erro) {

        console.error(erro);

        if (erro.code === "auth/invalid-credential") {

            mensagem.textContent =
                "E-mail ou senha incorretos.";

        }

        else if (erro.code === "auth/invalid-email") {

            mensagem.textContent =
                "Digite um e-mail válido.";

        }

        else if (erro.code === "auth/user-disabled") {

            mensagem.textContent =
                "Esta conta foi desativada.";

        }

        else {

            mensagem.textContent =
                "Erro ao realizar login.";

        }

    }

});

document.getElementById("googleLogin").addEventListener("click", async () => {

    try {

        const resultado =
            await entrarComGoogle();

        const user =
            resultado.user;

        console.log("Usuário Google:", user);

        console.log("UID:", user.uid);

        const referencia =
            doc(
                db,
                "usuarios",
                user.uid
            );

        const existe =
            await getDoc(referencia);

        if (!existe.exists()) {

            await setDoc(
                referencia,
                {
                    uid: user.uid,
                    nome: user.displayName || "",
                    email: user.email || "",
                    foto: user.photoURL || "",
                    criadoEm: new Date()
                }
            );

        }

        confirmarENavegar({
            tipo: "login",
            mensagem: "Login realizado!",
            destino: "inicio.html"
        });

    }

    catch (erro) {

        console.error(erro);

        if (erro.code === "auth/popup-closed-by-user") {

            mensagem.textContent =
                "A janela do Google foi fechada.";

        }

        else if (erro.code === "auth/popup-blocked") {

            mensagem.textContent =
                "O navegador bloqueou a janela do Google.";

        }

        else if (erro.code === "auth/unauthorized-domain") {

            mensagem.textContent =
                "Este domínio não está autorizado no Firebase.";

        }

        else {

            mensagem.textContent =
                "Erro ao entrar com Google: " +
                erro.message;

        }

    }

});

</script>

<script src="js/senhaVer.js"></script>
</body>

</html>
