<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro</title>
    <link rel="icon" href="fotos/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/controleFinanceiro.css">
    <link rel="stylesheet" href="css/desfazer.css">

    <!-- PWA: manifest, cor do tema e service worker -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5A32D3">
    <script src="js/pwa.js" defer></script>
    <link rel="stylesheet" href="css/nexusFlutuante.css">
</head>

<body>

    <div class="app">

        <header>
            <a class="voltar" id="voltar" href="evento.html" title="Voltar">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1>Controle Financeiro</h1>
        </header>

        <main>

            <div class="evento">
                <span>Evento</span>
                <h2 id="nomeEvento">Carregando...</h2>
            </div>

            <div class="orcamento">
                <h3>Total: R$ <span id="totalOrcamento">0</span></h3>
                <p class="grafico-titulo">Investimentos por categoria</p>
                <canvas id="orcamentoGrafico" class="grafico"></canvas>
                <ul class="legenda-cat" id="legendaCat"></ul>
                <p class="grafico-titulo">Receitas x Investimentos</p>
                <canvas id="graficoSimples" class="grafico grafico-simples"></canvas>
            </div>

            <!-- FILTRO -->
            <div class="wrap">
                <div class="filtros" id="filtro">
                    <button type="button" class="filtroControle ativo" data-filtro-controle="todos">Todos</button>
                    <button type="button" class="filtroControle" data-filtro-controle="receita">Receitas</button>
                    <button type="button" class="filtroControle" data-filtro-controle="despesa">Investimentos</button>

                    <!-- BOTÃO ADICIONAR -->

                    <button class="botao-novo" id="botaoNovo">
                        <i class="fa-solid fa-plus"></i> Novo Item
                    </button>
                </div>
            </div>

            <!--- LISTA -->
            <section class="lista-controleFinanceiro" id="listaControle">
                <p class="aviso">Carregando...</p>
            </section>

        </main>
    </div>


    <div class="modal" id="modal" hidden>
        <form class="modal-caixa" id="formControleFinanceiro">
            <div class="modal-topo">
                <h2 id="tituloModalFinanceiro">Adicionar Item Financeiro</h2>
                <button type="button" class="fechar" id="fecharModal" title="Fechar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <label for="tituloOrcamento">Titulo</label>
            <input type="text" id="tituloOrcamento" name="tituloOrcamento" required>

            <label for="descricaoOrcamento">Descrição:</label>
            <input type="text" id="descricaoOrcamento" name="descricaoOrcamento" required>

            <label for="valorOrcamento">Valor:</label>
            <input type="number" id="valorOrcamento" name="valorOrcamento" min="0" step="0.01" required>

            <label for="tipoOrcamento">Tipo:</label>
            <select id="tipoOrcamento" name="tipoOrcamento" required>
                <option value="">Selecione</option>
                <option value="receita">Receita</option>
                <option value="despesa">Investimento</option>
            </select>

            <div id="blocoCategoria" hidden>
                <label for="categoriaOrcamento">Categoria do gasto:</label>
                <select id="categoriaOrcamento" name="categoriaOrcamento"></select>
            </div>

            <button type="submit" id="botaoSalvar">Adicionar</button>
            <p id="mensagem"></p>
        </form>
    </div>

    <script>
        const modalControleFinanceiro = document.getElementById("modal");
        const formControleFinanceiro = document.getElementById("formControleFinanceiro");
        const mensagemControleFinanceiro = document.getElementById("mensagem");

        window.fecharModalControleFinanceiro = function () {
            modalControleFinanceiro.hidden = true;
        };

        document.getElementById("botaoNovo").addEventListener("click", () => {
            formControleFinanceiro.reset();
            mensagemControleFinanceiro.textContent = "";
            modalControleFinanceiro.hidden = false;
            document.getElementById("tituloOrcamento").focus();
        });

        document.getElementById("fecharModal").addEventListener("click", window.fecharModalControleFinanceiro);
        modalControleFinanceiro.addEventListener("click", (event) => {
            if (event.target === modalControleFinanceiro) window.fecharModalControleFinanceiro();
        });
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && !modalControleFinanceiro.hidden) {
                window.fecharModalControleFinanceiro();
            }
        });
    </script>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/desfazer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { avisarColaboracao } from "./js/avisos.js";
        import { getFirestore, doc, getDoc, collection, getDocs, addDoc, setDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        // FIREBASE_CONFIG vem do arquivo js/config.js
        const app = initializeApp(FIREBASE_CONFIG);
        const auth = getAuth(app);
        const db = getFirestore(app);


        // =============== ELEMENTOS =====================

        const nomeEventoEl = document.getElementById('nomeEvento');
        const voltarEl = document.getElementById("voltar");
        const orcamentoEl = document.getElementById("totalOrcamento");
        const form = document.getElementById('formControleFinanceiro');
        const botaoSalvar = document.getElementById('botaoSalvar');
        const botaoNovo = document.getElementById("botaoNovo");
        const mensagemEl = document.getElementById('mensagem');
        const listaEl = document.getElementById('listaControle');

        const eventoId = pegarIdDaUrl();
        let orcamentoInicial = 0;

        let itensOrcamento = [];
        let filtroAtivo = "todos";
        let souVisitante = false;
        let itemEditando = null;

        botaoNovo.addEventListener("click", () => {
            itemEditando = null;
            setTimeout(alternarCategoria, 0);
            document.getElementById("tituloModalFinanceiro").textContent = "Adicionar Item Financeiro";
            botaoSalvar.textContent = "Adicionar";
        });

        function abrirEdicao(item) {
            itemEditando = item;
            form.reset();
            mensagemEl.textContent = "";
            document.getElementById("tituloOrcamento").value = item.titulo || "";
            document.getElementById("descricaoOrcamento").value = item.descricao || "";
            document.getElementById("valorOrcamento").value = Number.isFinite(Number(item.valor)) ? item.valor : "";
            document.getElementById("tipoOrcamento").value = item.tipo || "";
            selCat.value = categoriaDe(item);
            alternarCategoria();
            document.getElementById("tituloModalFinanceiro").textContent = "Editar Item Financeiro";
            botaoSalvar.textContent = "Salvar alterações";
            document.getElementById("modal").hidden = false;
            document.getElementById("tituloOrcamento").focus();
        }

        // exclui na hora e oferece DESFAZER (recria o item com o mesmo id)
        async function excluirItem(item) {
            const copia = Object.assign({}, item);
            delete copia.id;
            try {
                await deleteDoc(doc(db, "eventos", eventoId, "controleFinanceiro", item.id));
                avisarColaboracao(db, auth.currentUser, eventoId, "financeiro", "removeu", item.titulo);
                await carregarControleFinanceiro();
                plannexusDesfazer("Item excluído", async () => {
                    await setDoc(doc(db, "eventos", eventoId, "controleFinanceiro", item.id), copia);
                    await carregarControleFinanceiro();
                });
            } catch (erro) {
                alert("Não foi possível excluir: " + erro.message);
            }
        }

        // ============ CATEGORIAS DE GASTO =============
        const CATEGORIAS = [
            ["Local / espaço", "#5A32D3"], ["Buffet / comida", "#E8590C"], ["Bebidas", "#0CA678"],
            ["Decoração", "#E64980"], ["Música / som", "#1C7ED6"], ["Foto e vídeo", "#7048E8"],
            ["Convites e papelaria", "#F59F00"], ["Lembrancinhas", "#D6336C"], ["Transporte", "#12B886"],
            ["Equipe / serviços", "#4263EB"], ["Roupas e beleza", "#AE3EC9"], ["Outros", "#868E96"]
        ];
        const COR_CAT = {};
        CATEGORIAS.forEach((c) => { COR_CAT[c[0]] = c[1]; });
        const selCat = document.getElementById("categoriaOrcamento");
        CATEGORIAS.forEach((c) => { const o = document.createElement("option"); o.value = c[0]; o.textContent = c[0]; selCat.appendChild(o); });
        function categoriaDe(item) { return COR_CAT[item.categoria] ? item.categoria : "Outros"; }
        function alternarCategoria() {
            document.getElementById("blocoCategoria").hidden = document.getElementById("tipoOrcamento").value !== "despesa";
        }
        document.getElementById("tipoOrcamento").addEventListener("change", alternarCategoria);

        function rotuloTipo(tipo) {
            if (tipo === "receita") return "Receita";
            if (tipo === "despesa") return "Investimento";
            return "Não informado";
        }


        // =============== INÍCIO =====================

        async function iniciar() {
            if (!eventoId) {
                nomeEventoEl.textContent = "Evento não encontrado.";
                listaEl.innerHTML = "<p class='aviso'>Abra o controle financeiro a partir da página de um evento.</p>";
                botaoNovo.disabled = true;
                return;
            }

            voltarEl.href = "evento.html?id=" + encodeURIComponent(eventoId);
            const usuario = await exigirLogin(auth, onAuthStateChanged);
            if (!usuario) return;

            // ============ PEGAR ORÇAMENTO INICIAL =============

            try {
                const eventoSnap = await getDoc(doc(db, "eventos", eventoId));
                if (!eventoSnap.exists()) {
                    nomeEventoEl.textContent = "Evento não encontrado.";
                    listaEl.innerHTML = "<p class='aviso'>Esse evento não existe mais.</p>";
                    botaoNovo.disabled = true;
                    return;
                }

                const evento = eventoSnap.data();
                nomeEventoEl.textContent = evento.nome || "Evento sem nome";
                orcamentoInicial = Number(evento.orcamento) || 0;

                // Visitante só visualiza: esconde o botão de adicionar item.
                if (evento.usuarioId !== usuario.uid) {
                    const membroSnap = await getDoc(doc(db, "eventos", eventoId, "membros", usuario.uid));
                    const papel = membroSnap.exists() ? membroSnap.data().papel : null;
                    souVisitante = papel === "visitante";
                    botaoNovo.hidden = souVisitante;
                }

                await carregarControleFinanceiro();
            } catch (error) {
                console.error("Erro ao carregar controle financeiro:", error);
                nomeEventoEl.textContent = "Erro ao carregar evento.";
                listaEl.innerHTML = "<p class='aviso'>Não foi possível carregar os dados financeiros.</p>";
            }
        }

        // ============ ADICIONAR ITEM FINANCEIRO =============

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const titulo = document.getElementById('tituloOrcamento').value.trim();
            const valor = Number(document.getElementById('valorOrcamento').value);

            let status;

            if (!titulo || !Number.isFinite(valor) || valor < 0) {
                mensagemEl.textContent = "Digite um título e um valor válido.";
                return;
            }

            botaoSalvar.disabled = true;
            botaoSalvar.textContent = "Salvando...";

            try {
                const campos = {
                    titulo: titulo,
                    descricao: document.getElementById('descricaoOrcamento').value.trim(),
                    valor: valor,
                    tipo: document.getElementById('tipoOrcamento').value
                };
                campos.categoria = campos.tipo === "despesa" ? selCat.value : "";
                if (itemEditando) {
                    await updateDoc(doc(db, "eventos", eventoId, "controleFinanceiro", itemEditando.id), campos);
                    avisarColaboracao(db, auth.currentUser, eventoId, "financeiro", "editou", titulo);
                } else {
                    await addDoc(collection(db, "eventos", eventoId, "controleFinanceiro"), Object.assign({ criadoEm: serverTimestamp() }, campos));
                    avisarColaboracao(db, auth.currentUser, eventoId, "financeiro", "adicionou", titulo);
                }
                await carregarControleFinanceiro();
                window.fecharModalControleFinanceiro();
            }

            catch (error) {
                console.error("Erro ao adicionar item financeiro:", error);
                mensagemEl.textContent = "Não foi possível salvar ou atualizar os itens financeiros.";
            } finally {
                botaoSalvar.disabled = false;
                botaoSalvar.textContent = itemEditando ? "Salvar alterações" : "Adicionar";
            }

        });

        async function carregarControleFinanceiro() {
            const snap = await getDocs(collection(db, "eventos", eventoId, "controleFinanceiro"));
            itensOrcamento = snap.docs.map((itemDoc) => ({
                id: itemDoc.id,
                ...itemDoc.data()
            }));

            const totais = itensOrcamento.reduce((saldo, item) => {
                const valor = Number(item.valor);
                if (!Number.isFinite(valor)) return saldo;
                if (item.tipo === "receita") {
                    saldo.receitas += valor;
                } else if (item.tipo === "despesa") {
                    saldo.despesas += valor;
                }
                return saldo;
            }, { receitas: 0, despesas: 0 });

            const total = orcamentoInicial + totais.receitas - totais.despesas;
            orcamentoEl.textContent = total.toLocaleString("pt-BR", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
            // por categoria (só investimentos), cada uma com sua cor
            const porCat = {};
            itensOrcamento.forEach((item) => {
                const v = Number(item.valor);
                if (item.tipo === "despesa" && Number.isFinite(v) && v > 0) porCat[categoriaDe(item)] = (porCat[categoriaDe(item)] || 0) + v;
            });
            const nomes = CATEGORIAS.map((c) => c[0]).filter((n) => porCat[n]);
            graficoOrcamento.data.labels = nomes;
            graficoOrcamento.data.datasets[0].data = nomes.map((n) => porCat[n]);
            graficoOrcamento.data.datasets[0].backgroundColor = nomes.map((n) => COR_CAT[n]);
            graficoOrcamento.update();
            const somaCat = nomes.reduce((t, n) => t + porCat[n], 0);
            document.getElementById("legendaCat").innerHTML = nomes.length
                ? nomes.map((n) => '<li><i style="background:' + COR_CAT[n] + '"></i>' + n + ' <b>' + Math.round(porCat[n] / somaCat * 100) + '%</b></li>').join("")
                : '<li class="vazio">Adicione investimentos para ver as categorias.</li>';
            graficoSimples.data.datasets[0].data = [totais.receitas, totais.despesas];
            graficoSimples.update();
            desenhar();
        }

        // ========== GRAFICO ==========
        const graficoOrcamento = new Chart(document.getElementById("orcamentoGrafico"), {
            type: "pie",
            data: {
                labels: [],
                datasets: [{
                    backgroundColor: [],
                    borderColor: "#fff",
                    borderWidth: 1,
                    hoverOffset: 4,
                    data: [0, 0]
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: "#000",
                        titleColor: "#fff"
                    }
                },
                animation: {
                    animateScale: true,
                    animateRotate: true
                }
            }
        });


        // gráfico simples: barras de receitas x investimentos
        const graficoSimples = new Chart(document.getElementById("graficoSimples"), {
            type: "bar",
            data: { labels: ["Receitas", "Investimentos"], datasets: [{ data: [0, 0], backgroundColor: ["#925edb", "#47158c"], borderRadius: 8 }] },
            options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });

        // ============ DESENHAR ITENS =============

        function desenhar() {
            listaEl.replaceChildren();
            const itensVisiveis = filtroAtivo === "todos"
                ? itensOrcamento
                : itensOrcamento.filter((item) => item.tipo === filtroAtivo);

            if (itensVisiveis.length === 0) {
                const aviso = document.createElement("p");
                aviso.className = "aviso";
                aviso.textContent = itensOrcamento.length === 0
                    ? "Nenhum item financeiro encontrado."
                    : "Nenhum item encontrado nesse filtro.";
                listaEl.appendChild(aviso);
                return;
            }

            itensVisiveis.forEach(item => {
                const card = document.createElement('div');
                if (item.tipo === "despesa") {
                    card.className = "cardInvestimento";
                } else {
                    card.className = "cardReceita";
                }
                const titulo = document.createElement("h3");
                titulo.textContent = item.titulo || "Item sem título";
                const descricao = document.createElement("p");
                descricao.textContent = item.descricao || "";
                const valor = document.createElement("p");
                const valorNumerico = Number(item.valor);
                valor.textContent = `Valor: R$ ${Number.isFinite(valorNumerico) ? valorNumerico.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0,00"}`;
                const tipo = document.createElement("p");
                tipo.textContent = `Tipo: ${rotuloTipo(item.tipo)}` + (item.tipo === "despesa" ? ` · ${categoriaDe(item)}` : "");
                card.append(titulo, descricao, valor, tipo);
                if (!souVisitante) {
                    const acoes = document.createElement("div");
                    acoes.className = "acoes-linha";
                    const bEd = document.createElement("button");
                    bEd.type = "button"; bEd.className = "editar"; bEd.title = "Editar item"; bEd.setAttribute("aria-label", "Editar item");
                    bEd.innerHTML = '<i class="fa-solid fa-pen"></i>';
                    bEd.addEventListener("click", () => abrirEdicao(item));
                    const bEx = document.createElement("button");
                    bEx.type = "button"; bEx.className = "excluir"; bEx.title = "Excluir item"; bEx.setAttribute("aria-label", "Excluir item");
                    bEx.innerHTML = '<i class="fa-regular fa-trash-can"></i>';
                    bEx.addEventListener("click", () => excluirItem(item));
                    acoes.append(bEd, bEx);
                    card.appendChild(acoes);
                }
                listaEl.appendChild(card);
            });
        }


        // ============ FILTRO =============
        document.querySelectorAll("#filtro .filtroControle").forEach(botao => {
            botao.addEventListener("click", () => {
                document.querySelectorAll("#filtro .filtroControle").forEach(b => b.classList.remove("ativo"));
                botao.classList.add("ativo");
                filtroAtivo = botao.dataset.filtroControle;
                desenhar();
            });
        });


        // ================= ERROS =================
        function mostrarErro(erro) {
            console.error("Erro no orçamento:", erro);

            const semPermissao = erro && erro.code === "permission-denied";

            listaEl.innerHTML = `
                <p class="aviso erro">
                    ${semPermissao
                    ? "Sem permissão para acessar o orçamento. Confira as regras do Firestore (arquivo firestore.rules)."
                    : "Erro ao carregar o orçamento. Veja o console (F12)."}
                </p>`;
        }

        iniciar();

    </script>



    <!-- Nexus flutuante: assistente de ajuda -->
    <script type="module" src="js/nexusFlutuante.js"></script>

</body>

</html>
