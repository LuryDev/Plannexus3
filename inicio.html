<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PlanNexus</title>
    <link rel="icon" href="fotos/logo.png">

    <!-- Ícones -->
    <link
   
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
 
</head>

<body>


<div class="app">


    <!-- TOPO -->

    <header>

        <div class="logo">

           <a href="index.html"><img
                src="fotos/logo.png"
                alt=""
            > </a> 

        </div>


        <div class="notification" id="botaoNotificacao">

            <i class="fa-regular fa-bell"></i>

            <span class="badge-notificacao" id="badgeNotificacao" hidden></span>

        </div>

    </header>


    <!-- BANNER -->

   <section class="banner">

    <img
        src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?w=900"
        alt=""
    >

    <span class="banner-orbit orbit-1"></span>
    <span class="banner-orbit orbit-2"></span>

    <span class="banner-glow"></span>

    <span class="particle particle-1"></span>
    <span class="particle particle-2"></span>
    <span class="particle particle-3"></span>
    <span class="particle particle-4"></span>

    <span class="shine"></span>

    <div class="banner-overlay">
        <h2 id="boasVindas">
            Bem-vindo(a)
        </h2>
    </div>

</section>


    <!-- INDICADOR -->

    <div class="dots">

        <span class="active"></span>

        <span></span>

        <span></span>

        <span></span>

    </div>


    <!-- CONVITES PENDENTES (abaixo do "Bem-vindo(a)") -->

    <div class="convites-home" id="convitesHome" hidden></div>


    <!-- CONTEÚDO -->

 <main>
<br>
    <h1>Gerencie seus eventos</h1>

    <div class="search">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
            type="text"
            id="pesquisaEvento"
            placeholder="Buscar seus eventos"
        >

    </div><br>


    <div id="listaEventos">

        <p>Carregando eventos...</p>

    </div>

</main>

    

</div>


<!-- MENU -->

<nav class="bottom-nav">


    <a href="#">

        <i class="fa-solid fa-house"></i>

    </a>


    <!-- BOTÃO CRIAR EVENTO -->

    <a
        class="add"
        href="#"
        id="botaoCriarEvento"
    >

        <i class="fa-solid fa-plus"></i>

    </a>


    <!-- PERFIL -->

    <a href="login.html" id="perfil">

        <i class="fa-regular fa-user"></i>

    </a>


</nav>



<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import {
        getFirestore,
        collection,
        collectionGroup,
        doc,
        getDoc,
        query,
        where,
        getDocs,
        updateDoc,
        writeBatch,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    // FIREBASE_CONFIG vem do arquivo js/config.js
    const app  = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    const botaoCriarEvento =
        document.getElementById("botaoCriarEvento");


    const boasVindas =
        document.getElementById("boasVindas");


    const listaEventos =
        document.getElementById("listaEventos");


    const pesquisaEvento =
        document.getElementById("pesquisaEvento");


    const badgeNotificacao =
        document.getElementById("badgeNotificacao");

    const convitesHome =
        document.getElementById("convitesHome");


    let usuarioAtual = null;


    onAuthStateChanged(auth, (usuario) => {


        if (usuario) {


            usuarioAtual = usuario;

            document.getElementById("perfil").href = "perfilPessoal.html";

            console.log("Usuário logado!");

            console.log("UID:", usuario.uid);


            // Status


            // Nome no banner

            boasVindas.innerHTML =
                "Bem-vindo(a)<br>" +
                (usuario.displayName || usuario.email);


            // Carregar eventos

            carregarEventos(usuario);


            // Carregar convites pendentes (colaborador/visitante)

            carregarConvites(usuario);


        }

        else {


            usuarioAtual = null;

            document.getElementById("perfil").href = "login.html";

            console.log("Usuário não está logado.");


            boasVindas.innerHTML =
                "Bem-vindo(a)";


            convitesHome.hidden = true;
            convitesHome.innerHTML = "";
            badgeNotificacao.hidden = true;


            listaEventos.innerHTML = `
                <p>Faça login para visualizar seus eventos.</p>
            `;

        }

    });


    // ==========================================
    // CONVITES PENDENTES (colaborador/visitante)
    // ==========================================

    function papelLegivel(papel) {
        if (papel === "colaborador") return "Colaborador";
        if (papel === "visitante") return "Visitante";
        return papel;
    }

    function cartaoConvite(documento) {
        const convite = documento.data();

        return `
            <div class="convite-card" data-id="${documento.id}">
                <p>
                    Você foi convidado(a) para o evento
                    <strong>${escaparHTML(convite.eventoNome || "Evento sem nome")}</strong>
                    como <strong>${escaparHTML(papelLegivel(convite.papel))}</strong>.
                </p>
                <div class="convite-acoes">
                    <button type="button" class="btn-aceitar" data-id="${documento.id}" data-acao="aceitar">Aceitar</button>
                    <button type="button" class="btn-recusar" data-id="${documento.id}" data-acao="recusar">Recusar</button>
                </div>
            </div>
        `;
    }

    function ativarBotoesConvite(container, convitesPorId) {
        container.querySelectorAll("[data-acao]").forEach((botao) => {
            botao.addEventListener("click", () => {
                const conviteId = botao.dataset.id;
                const aceitar = botao.dataset.acao === "aceitar";
                responderConvite(conviteId, convitesPorId.get(conviteId), aceitar);
            });
        });
    }

    async function carregarConvites(usuario) {

        try {

            const referenciaConvites = collection(db, "convites");

            const consulta = query(
                referenciaConvites,
                where("emailConvidado", "==", usuario.email),
                where("status", "==", "pendente")
            );

            const resultado = await getDocs(consulta);

            if (resultado.empty) {
                badgeNotificacao.hidden = true;

                convitesHome.hidden = true;
                convitesHome.innerHTML = "";

                return;
            }

            const convitesPorId = new Map();
            resultado.forEach((documento) => convitesPorId.set(documento.id, documento.data()));

            const htmlConvites = resultado.docs.map(cartaoConvite).join("");

            badgeNotificacao.hidden = false;

            convitesHome.innerHTML = htmlConvites;
            convitesHome.hidden = false;
            ativarBotoesConvite(convitesHome, convitesPorId);

        } catch (erro) {
            console.error("Erro ao carregar convites:", erro);
        }
    }

    async function responderConvite(conviteId, convite, aceitar) {

        if (!convite || !usuarioAtual) return;

        const cartoes = document.querySelectorAll(`[data-id="${conviteId}"].convite-card`);
        cartoes.forEach((cartao) => {
            cartao.querySelectorAll("button").forEach((botao) => botao.disabled = true);
        });

        try {

            const referenciaConvite = doc(db, "convites", conviteId);

            if (aceitar) {

                // Aceitar cria o registro de membro do evento e marca o
                // convite como respondido, na mesma operação atômica.
                const referenciaMembro = doc(
                    db,
                    "eventos",
                    convite.eventoId,
                    "membros",
                    usuarioAtual.uid
                );

                const lote = writeBatch(db);

                lote.set(referenciaMembro, {
                    uid: usuarioAtual.uid,
                    email: usuarioAtual.email,
                    papel: convite.papel,
                    conviteId: conviteId,
                    dataEntrada: serverTimestamp()
                });

                lote.update(referenciaConvite, {
                    status: "aceito",
                    dataResposta: serverTimestamp()
                });

                await lote.commit();

            } else {

                await updateDoc(referenciaConvite, {
                    status: "recusado",
                    dataResposta: serverTimestamp()
                });

            }

            carregarConvites(usuarioAtual);

        } catch (erro) {
            console.error("Erro ao responder convite:", erro);
            alert("Não foi possível responder o convite. Tente novamente.");

            cartoes.forEach((cartao) => {
                cartao.querySelectorAll("button").forEach((botao) => botao.disabled = false);
            });
        }
    }

    // ==========================================
    // BUSCAR EVENTOS DO USUÁRIO
    // ==========================================

    async function carregarEventos(usuario) {

        try {

            // Eventos que o usuário criou
            const consultaProprios = query(
                collection(db, "eventos"),
                where("usuarioId", "==", usuario.uid)
            );

            const resultadoProprios = await getDocs(consultaProprios);

            const eventosProprios = resultadoProprios.docs.map((documento) => ({
                id: documento.id,
                papel: "dono",
                ...documento.data()
            }));

            // Eventos em que o usuário é colaborador ou visitante
            // (busca em "membros" de todos os eventos de uma vez)
            let eventosCompartilhados = [];

            try {
                const consultaMembros = query(
                    collectionGroup(db, "membros"),
                    where("uid", "==", usuario.uid)
                );

                const resultadoMembros = await getDocs(consultaMembros);

                eventosCompartilhados = (await Promise.all(
                    resultadoMembros.docs.map(async (membroDoc) => {
                        const eventoId = membroDoc.ref.parent.parent.id;
                        const papel = membroDoc.data().papel || "visitante";

                        const eventoSnap = await getDoc(doc(db, "eventos", eventoId));
                        if (!eventoSnap.exists()) return null;

                        return {
                            id: eventoId,
                            papel: papel,
                            ...eventoSnap.data()
                        };
                    })
                )).filter(Boolean);

            } catch (erroMembros) {
                console.error("Erro ao buscar eventos compartilhados:", erroMembros);
            }

            const todosEventos = [...eventosProprios, ...eventosCompartilhados];

            listaEventos.innerHTML = "";

            if (!todosEventos.length) {
                listaEventos.innerHTML = `
                    <p>Você ainda não possui eventos.</p>
                `;
                return;
            }

            todosEventos.forEach((evento) => {

                const card = document.createElement("div");

                card.classList.add("evento");
                card.dataset.id = evento.id;

                const seloPapel = evento.papel === "dono"
                    ? ""
                    : `<span class="selo-papel-evento">${evento.papel === "colaborador" ? "Colaborador" : "Visitante"}</span>`;

                card.innerHTML = `

                    <!-- ÍCONE DO EVENTO -->
                    <div class="evento-icone">
                        <i class="fa-solid fa-calendar-days"></i>
                    </div>

                    ${seloPapel}

                    <!-- NOME DO EVENTO -->
                    <h2>
                        ${escaparHTML(evento.nome)}
                    </h2>

                    <!-- INFORMAÇÕES DO EVENTO -->
                    <p>
                        <i class="fa-solid fa-calendar"></i>
                        ${escaparHTML(formatarData(evento.data))}
                    </p>

                    <p>
                        <i class="fa-solid fa-clock"></i>
                        ${escaparHTML(evento.horario)}
                    </p>

                    <p>
                        <i class="fa-solid fa-location-dot"></i>
                        ${escaparHTML(evento.local)}
                    </p>

                    <p>
                        <strong>Categoria:</strong>
                        ${escaparHTML(evento.categoria)}
                    </p>

                    <!-- BOTÃO PARA ABRIR O EVENTO -->
                    <button class="abrirEvento" title="Ver evento">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>

                `;

                listaEventos.appendChild(card);

                const botao = card.querySelector(".abrirEvento");

                botao.addEventListener("click", function () {
                    window.location.href = "evento.html?id=" + encodeURIComponent(evento.id);
                });

            });

        }

        catch (erro) {

            console.error(
                "Erro ao buscar eventos:",
                erro
            );

            listaEventos.innerHTML = `
                <p>Erro ao carregar eventos.</p>
            `;

        }

    }


    // ==========================================
    // PESQUISA DE EVENTOS
    // ==========================================

    pesquisaEvento.addEventListener(
        "input",
        function() {


            const texto =
                pesquisaEvento.value
                    .toLowerCase();


            const eventos =
                document.querySelectorAll(
                    ".evento"
                );


            eventos.forEach((evento) => {


                const nome =
                    evento
                        .querySelector("h2")
                        .textContent
                        .toLowerCase();


                if (nome.includes(texto)) {

                    evento.style.display =
                        "";

                }

                else {

                    evento.style.display =
                        "none";

                }

            });

        }
    );


    // ==========================================
    // BOTÃO CRIAR EVENTO
    // ==========================================

    botaoCriarEvento.addEventListener(
        "click",
        function(event) {


            event.preventDefault();


            if (usuarioAtual) {


                window.location.href =
                    "criarEvento.html";


            }

            else {


                alert(
                    "Você precisa estar logado para criar um evento."
                );


                window.location.href =
                    "login.html";

            }

        }
    );


    </script>

</body>

</html>
