<script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import {
        getFirestore,
        collection,
        doc,
        getDoc,
        query,
        where,
        getDocs,
        updateDoc,
        deleteField
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    import { categoriaDoAviso, carregarDesligadas } from "./js/avisos.js";
    import { pendentesDoEvento, temNovidadeDesdeVisita } from "./js/pendencias.js";
    import { pushDisponivel, pushAtivo } from "./js/push.js";

    // FIREBASE_CONFIG vem do arquivo js/config.js
    const app  = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    const botaoCriarEvento =
        document.getElementById("botaoCriarEvento");


    const boasVindas =
        document.getElementById("boasVindas");


    const listaEventos =
        document.getElementById("listaEventos");


    const pesquisaEvento =
        document.getElementById("pesquisaEvento");


    const badgeNotificacao =
        document.getElementById("badgeNotificacao");


    let usuarioAtual = null;


    onAuthStateChanged(auth, (usuario) => {


        if (usuario) {


            usuarioAtual = usuario;

            document.getElementById("perfil").href = "perfilPessoal.html";

            console.log("Usuário logado!");

            console.log("UID:", usuario.uid);


            // Status


            // Nome no banner

            boasVindas.innerHTML =
                "Bem-vindo(a)<br>" +
                (usuario.displayName || usuario.email);


            // Carregar eventos

            carregarEventos(usuario);


            // Checar convites/avisos pendentes (só acende o sininho;
            // a lista fica na página de notificações)

            atualizarSininho(usuario);


        }

        else {


            usuarioAtual = null;

            document.getElementById("perfil").href = "login.html";

            console.log("Usuário não está logado.");


            boasVindas.innerHTML =
                "Bem-vindo(a)";


            badgeNotificacao.hidden = true;


            listaEventos.innerHTML = `
                <p>Faça login para visualizar seus eventos.</p>
            `;

        }

    });


    // ==========================================
    // SININHO (convites/avisos pendentes)
    // A lista completa fica só na página de notificações; aqui é
    // só pra decidir se o ponto vermelho aparece ou não.
    // ==========================================

    // Convite discreto para ativar as notificações: só a partir da 2ª vez que abre o app,
    // só se ainda não decidiu, e leva à página onde a permissão é pedida de verdade.
    function mostrarConviteNotificacoes() {
        try {
            if (!pushDisponivel() || pushAtivo() || Notification.permission !== "default") return;
            if (localStorage.getItem("conviteNotifDispensado") === "1") return;

            const visitas = Number(localStorage.getItem("visitasInicio") || 0) + 1;
            localStorage.setItem("visitasInicio", String(visitas));
            if (visitas < 2) return;

            const faixa = document.createElement("div");
            faixa.style.cssText = "position:fixed;left:12px;right:12px;bottom:14px;z-index:40;display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-radius:14px;box-shadow:0 6px 22px rgba(90,50,211,.25);font-size:13px;";
            faixa.innerHTML = '<span style="flex:1">🔔 Quer receber lembretes dos seus eventos mesmo com o app fechado?</span>' +
                '<a href="notificacoes.html" style="padding:8px 12px;color:#fff;background:#5A32D3;border-radius:10px;text-decoration:none;font-weight:600">Ativar</a>' +
                '<button type="button" aria-label="Fechar" style="border:0;background:none;font-size:18px;cursor:pointer">×</button>';

            faixa.querySelector("button").addEventListener("click", () => {
                localStorage.setItem("conviteNotifDispensado", "1");
                faixa.remove();
            });

            document.body.appendChild(faixa);
        } catch (erro) { /* convite é opcional */ }
    }

    async function atualizarSininho(usuario) {

        mostrarConviteNotificacoes();


        let temConvitePendente = false;

        try {
            const consultaConvites = query(
                collection(db, "convites"),
                where("emailConvidado", "==", usuario.email),
                where("status", "==", "pendente")
            );

            const resultadoConvites = await getDocs(consultaConvites);
            temConvitePendente = !resultadoConvites.empty;

        } catch (erro) {
            console.error("Erro ao checar convites:", erro);
        }

        let temAvisoNaoLido = false;

        try {
            const consultaAvisos = query(
                collection(db, "avisos"),
                where("uid", "==", usuario.uid),
                where("lida", "==", false)
            );

            const resultadoAvisos = await getDocs(consultaAvisos);
            const desligadas = await carregarDesligadas(db, usuario.uid);

            temAvisoNaoLido = resultadoAvisos.docs.some((d) => !desligadas.includes(categoriaDoAviso(d.data())));

        } catch (erro) {
            console.error("Erro ao checar avisos:", erro);
        }

        badgeNotificacao.hidden = !(temConvitePendente || temAvisoNaoLido);
    }

    // ==========================================
    // BOLINHA "!" NOS EVENTOS
    // Aparece se o evento tem funções que o usuário ainda não abriu ou se
    // alguém mexeu nele (avisos não lidos) depois da última visita dele.
    // ==========================================
    // evento "feito": a data (e a hora, se tiver) já passou
    function eventoJaAconteceu(evento) {
        if (!evento.data) return false;
        const partes = String(evento.data).split("-");
        if (partes.length < 3) return false;
        const hora = /^(\d{1,2}):(\d{2})/.exec(evento.horario || "");
        const quando = hora
            ? new Date(+partes[0], +partes[1] - 1, +partes[2], +hora[1], +hora[2])
            : new Date(+partes[0], +partes[1] - 1, +partes[2], 23, 59);
        return quando.getTime() < Date.now();
    }

    async function marcarPontosDosEventos(usuario, eventos) {
        let avisos = [];
        try {
            const snap = await getDocs(query(collection(db, "avisos"), where("uid", "==", usuario.uid), where("lida", "==", false)));
            const desligadas = await carregarDesligadas(db, usuario.uid);
            avisos = snap.docs.map((d) => d.data()).filter((a) => !desligadas.includes(categoriaDoAviso(a)));
        } catch (erro) { /* sem avisos: só as pendências */ }

        eventos.forEach((evento) => {
            const card = listaEventos.querySelector('.evento[data-id="' + evento.id + '"]');
            if (!card) return;
            if (eventoJaAconteceu(evento)) {
                const feito = document.createElement("span");
                feito.className = "bolinha-aviso bolinha-feito";
                feito.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
                feito.title = "Evento realizado";
                feito.setAttribute("aria-label", "Evento realizado");
                card.appendChild(feito);
                return;
            }
            const novidade = temNovidadeDesdeVisita(avisos, usuario.uid, evento.id);
            const pendencias = pendentesDoEvento(usuario.uid, evento, evento.papel === "dono").length;
            if (!novidade && !pendencias) return;
            const ponto = document.createElement("span");
            ponto.className = "bolinha-aviso";
            ponto.textContent = "!";
            ponto.title = novidade ? "Novidades neste evento" : "Funções ainda não abertas";
            ponto.setAttribute("aria-label", ponto.title);
            card.appendChild(ponto);
        });
    }

    // ==========================================
    // BUSCAR EVENTOS DO USUÁRIO
    // ==========================================

    async function carregarEventos(usuario) {

        try {

            // Eventos que o usuário criou
            const consultaProprios = query(
                collection(db, "eventos"),
                where("usuarioId", "==", usuario.uid)
            );

            const resultadoProprios = await getDocs(consultaProprios);

            const eventosProprios = resultadoProprios.docs.map((documento) => ({
                id: documento.id,
                papel: "dono",
                ...documento.data()
            }));

            // Eventos em que o usuário é colaborador ou visitante.
            // A lista de IDs candidatos vem do próprio perfil
            // (usuarios/{uid}.eventosCompartilhados), preenchida quando um
            // convite é aceito. O papel e a existência são sempre
            // confirmados em "membros" (fonte da verdade) — isso evita
            // depender de uma consulta "collection group" (que exigiria
            // criar um índice manual no Firebase) e ainda limpa sozinho
            // vínculos de eventos excluídos ou de onde o usuário foi removido.
            let eventosCompartilhados = [];

            try {
                const perfilSnap = await getDoc(doc(db, "usuarios", usuario.uid));
                const mapaCompartilhados = perfilSnap.exists()
                    ? (perfilSnap.data().eventosCompartilhados || {})
                    : {};

                const idsCompartilhados = Object.keys(mapaCompartilhados);

                eventosCompartilhados = (await Promise.all(
                    idsCompartilhados.map(async (eventoCompartilhadoId) => {
                        try {
                            const referenciaMembro = doc(
                                db, "eventos", eventoCompartilhadoId, "membros", usuario.uid
                            );
                            const membroSnap = await getDoc(referenciaMembro);

                            if (!membroSnap.exists()) {
                                // Não é mais membro (saiu ou foi removido).
                                // Limpa o vínculo do próprio perfil.
                                updateDoc(doc(db, "usuarios", usuario.uid), {
                                    [`eventosCompartilhados.${eventoCompartilhadoId}`]: deleteField()
                                }).catch(() => {});
                                return null;
                            }

                            const papel = membroSnap.data().papel || "visitante";

                            const eventoSnap = await getDoc(doc(db, "eventos", eventoCompartilhadoId));
                            if (!eventoSnap.exists()) {
                                // Evento foi excluído. Limpa o vínculo também.
                                updateDoc(doc(db, "usuarios", usuario.uid), {
                                    [`eventosCompartilhados.${eventoCompartilhadoId}`]: deleteField()
                                }).catch(() => {});
                                return null;
                            }

                            return {
                                id: eventoCompartilhadoId,
                                papel: papel,
                                ...eventoSnap.data()
                            };
                        } catch (erroEvento) {
                            console.error("Erro ao carregar evento compartilhado:", eventoCompartilhadoId, erroEvento);
                            return null;
                        }
                    })
                )).filter(Boolean);

            } catch (erroMembros) {
                console.error("Erro ao buscar eventos compartilhados:", erroMembros);
            }

            const todosEventos = [...eventosProprios, ...eventosCompartilhados];

            listaEventos.innerHTML = "";

            if (!todosEventos.length) {
                listaEventos.innerHTML = `
                    <p>Você ainda não possui eventos.</p>
                `;
                return;
            }

            todosEventos.forEach((evento) => {

                const card = document.createElement("div");

                card.classList.add("evento");
                card.dataset.id = evento.id;
                card.dataset.categoria = evento.categoria || "";
                card.dataset.situacao = eventoJaAconteceu(evento) ? "concluido" : "andamento";
                if (eventoJaAconteceu(evento)) card.dataset.feito = "1";
                card.setAttribute("role", "link");
                card.tabIndex = 0;
                card.setAttribute("aria-label", "Abrir evento " + (evento.nome || ""));

                const seloPapel = evento.papel === "dono"
                    ? ""
                    : `<span class="selo-papel-evento">${evento.papel === "colaborador" ? "Colaborador" : "Visitante"}</span>`;

                card.innerHTML = `

                    <!-- ÍCONE DO EVENTO -->
                    <div class="evento-icone">
                        <i class="${iconeDoEvento(evento.categoria)}"></i>
                    </div>

                    ${seloPapel}

                    <!-- NOME DO EVENTO -->
                    <h2>
                        ${escaparHTML(evento.nome)}
                    </h2>

                    <!-- INFORMAÇÕES DO EVENTO -->
                    <p>
                        <i class="fa-solid fa-calendar"></i>
                        ${escaparHTML(formatarData(evento.data))}
                    </p>

                    <p>
                        <i class="fa-solid fa-clock"></i>
                        ${escaparHTML(evento.horario)}
                    </p>

                    <p>
                        <i class="fa-solid fa-location-dot"></i>
                        ${escaparHTML(evento.local)}
                    </p>

                    <p>
                        <strong>Categoria:</strong>
                        ${escaparHTML(evento.categoria)}
                    </p>

                    <!-- BOTÃO PARA ABRIR O EVENTO -->
                    <button class="abrirEvento" title="Ver evento" tabindex="-1" aria-hidden="true">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>

                `;

                listaEventos.appendChild(card);

                // o card inteiro abre o evento
                const abrir = function () {
                    window.location.href = "evento.html?id=" + encodeURIComponent(evento.id);
                };

                card.addEventListener("click", abrir);

                card.addEventListener("keydown", function (e) {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        abrir();
                    }
                });

            });

            aplicarFiltros();

            // bolinha "!" nos eventos com pendências ou novidades (não trava a lista se falhar)
            marcarPontosDosEventos(usuario, todosEventos).catch((erro) => console.warn("Pontos dos eventos:", erro));

        }

        catch (erro) {

            console.error(
                "Erro ao buscar eventos:",
                erro
            );

            listaEventos.innerHTML = `
                <p>Erro ao carregar eventos.</p>
            `;

        }

    }


    // ==========================================
    // PESQUISA DE EVENTOS
    // ==========================================

    let categoriaFiltro = "";
    let situacaoFiltro = "";

    function aplicarFiltros() {

        const texto = pesquisaEvento.value.toLowerCase();

        document.querySelectorAll("#listaEventos .evento").forEach((evento) => {

            const nome = evento.querySelector("h2").textContent.toLowerCase();
            const categoria = evento.dataset.categoria || "";

            const okTexto = nome.includes(texto) || categoria.toLowerCase().includes(texto);
            const okCategoria = !categoriaFiltro
                || (categoriaFiltro === "__feito" ? evento.dataset.feito === "1" : categoria === categoriaFiltro);

            const okSituacao = !situacaoFiltro || evento.dataset.situacao === situacaoFiltro;

            evento.style.display = (okTexto && okCategoria && okSituacao) ? "" : "none";

        });

    }

    pesquisaEvento.addEventListener("input", aplicarFiltros);

    document.getElementById("filtrosCategoria").addEventListener("click", function (e) {

        const botao = e.target.closest(".filtro-cat");
        if (!botao) return;

        categoriaFiltro = botao.dataset.cat;

        document.querySelectorAll("#filtrosCategoria .filtro-cat").forEach((b) => {
            const ativo = b === botao;
            b.classList.toggle("ativo", ativo);
            b.setAttribute("aria-pressed", ativo ? "true" : "false");
        });

        aplicarFiltros();

    });


    document.getElementById("filtrosSituacao").addEventListener("click", function (e) {

        const botao = e.target.closest(".filtro-cat");
        if (!botao) return;

        situacaoFiltro = botao.dataset.sit;

        document.querySelectorAll("#filtrosSituacao .filtro-cat").forEach((b) => {
            const ativo = b === botao;
            b.classList.toggle("ativo", ativo);
            b.setAttribute("aria-pressed", ativo ? "true" : "false");
        });

        aplicarFiltros();

    });


    // ==========================================
    // BOTÃO CRIAR EVENTO
    // ==========================================

    botaoCriarEvento.addEventListener(
        "click",
        function(event) {


            event.preventDefault();


            if (usuarioAtual) {


                window.location.href =
                    "criarEvento.html";


            }

            else {


                alert(
                    "Você precisa estar logado para criar um evento."
                );


                window.location.href =
                    "login.html";

            }

        }
    );


    </script>
