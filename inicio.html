<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PlanNexus</title>
    <link rel="icon" href="fotos/logo.png">

    <!-- Ícones -->
    <link
   
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
 
</head>

<body>


<div class="app">


    <!-- TOPO -->

    <header>

        <div class="logo">

           <a href="index.html"><img
                src="fotos/logo.png"
                alt=""
            > </a> 

        </div>


        <div class="notification">

            <i class="fa-regular fa-bell"></i>

        </div>

    </header>


    <!-- BANNER -->

   <section class="banner">

    <img
        src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?w=900"
        alt=""
    >

    <span class="banner-orbit orbit-1"></span>
    <span class="banner-orbit orbit-2"></span>

    <span class="banner-glow"></span>

    <span class="particle particle-1"></span>
    <span class="particle particle-2"></span>
    <span class="particle particle-3"></span>
    <span class="particle particle-4"></span>

    <span class="shine"></span>

    <div class="banner-overlay">
        <h2 id="boasVindas">
            Bem-vindo(a)
        </h2>
    </div>

</section>


    <!-- INDICADOR -->

    <div class="dots">

        <span class="active"></span>

        <span></span>

        <span></span>

        <span></span>

    </div>


    <!-- CONTEÚDO -->

 <main>
<br>
    <h1>Gerencie seus eventos</h1>

    <div class="search">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
            type="text"
            id="pesquisaEvento"
            placeholder="Buscar seus eventos"
        >

    </div><br>


    <div id="listaEventos">

        <p>Carregando eventos...</p>

    </div>

</main>

    

</div>


<!-- MENU -->

<nav class="bottom-nav">


    <a href="#">

        <i class="fa-solid fa-house"></i>

    </a>


    <!-- BOTÃO CRIAR EVENTO -->

    <a
        class="add"
        href="#"
        id="botaoCriarEvento"
    >

        <i class="fa-solid fa-plus"></i>

    </a>


    <!-- PERFIL -->

    <a href="login.html" id="perfil">

        <i class="fa-regular fa-user"></i>

    </a>


</nav>



<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    // FIREBASE_CONFIG vem do arquivo js/config.js
    const app  = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    const botaoCriarEvento =
        document.getElementById("botaoCriarEvento");


    const boasVindas =
        document.getElementById("boasVindas");


    const listaEventos =
        document.getElementById("listaEventos");


    const pesquisaEvento =
        document.getElementById("pesquisaEvento");



    let usuarioAtual = null;


    onAuthStateChanged(auth, (usuario) => {


        if (usuario) {


            usuarioAtual = usuario;

            document.getElementById("perfil").href = "perfilPessoal.html";

            console.log("Usuário logado!");

            console.log("UID:", usuario.uid);


            // Status


            // Nome no banner

            boasVindas.innerHTML =
                "Bem-vindo(a)<br>" +
                (usuario.displayName || usuario.email);


            // Carregar eventos

            carregarEventos(usuario);


        }

        else {


            usuarioAtual = null;

            document.getElementById("perfil").href = "login.html";

            console.log("Usuário não está logado.");


            boasVindas.innerHTML =
                "Bem-vindo(a)";


            listaEventos.innerHTML = `
                <p>Faça login para visualizar seus eventos.</p>
            `;

        }

    });


    // ==========================================
    // BUSCAR EVENTOS DO USUÁRIO
    // ==========================================

    async function carregarEventos(usuario) {


        try {


            const eventosRef =
                collection(db, "eventos");


            const consulta =
                query(
                    eventosRef,
                    where(
                        "usuarioId",
                        "==",
                        usuario.uid
                    )
                );


            const resultado =
                await getDocs(consulta);
                console.log("Quantidade de eventos encontrados:", resultado.size);

resultado.forEach((documento) => {

    console.log(
        "Evento:",
        documento.id,
        documento.data()
    );

});


            listaEventos.innerHTML = "";


            if (resultado.empty) {


                listaEventos.innerHTML = `
                    <p>Você ainda não possui eventos.</p>
                `;


                return;

            }


            resultado.forEach((documento) => {


                const evento =
                    documento.data();


  const card =
    document.createElement("div");


card.classList.add("evento");

card.dataset.id = documento.id;


card.innerHTML = `

    <!-- ÍCONE DO EVENTO -->
    <div class="evento-icone">
        <i class="fa-solid fa-calendar-days"></i>
    </div>

    <!-- NOME DO EVENTO -->
    <h2>
        ${escaparHTML(evento.nome)}
    </h2>

    <!-- INFORMAÇÕES DO EVENTO -->
    <p>
        <i class="fa-solid fa-calendar"></i>
        ${escaparHTML(formatarData(evento.data))}
    </p>

    <p>
        <i class="fa-solid fa-clock"></i>
        ${escaparHTML(evento.horario)}
    </p>

    <p>
        <i class="fa-solid fa-location-dot"></i>
        ${escaparHTML(evento.local)}
    </p>

    <p>
        <strong>Categoria:</strong>
        ${escaparHTML(evento.categoria)}
    </p>

    <!-- BOTÃO PARA ABRIR O EVENTO -->
    <button class="abrirEvento" title="Ver evento">
        <i class="fa-solid fa-arrow-right"></i>
    </button>

`;
listaEventos.appendChild(card);

const botao = card.querySelector(".abrirEvento");

botao.addEventListener("click", function(){

    window.location.href =
        "evento.html?id=" + encodeURIComponent(documento.id);

});

});


        }

        catch (erro) {


            console.error(
                "Erro ao buscar eventos:",
                erro
            );


            listaEventos.innerHTML = `
                <p>Erro ao carregar eventos.</p>
            `;

        }

    }


    // ==========================================
    // PESQUISA DE EVENTOS
    // ==========================================

    pesquisaEvento.addEventListener(
        "input",
        function() {


            const texto =
                pesquisaEvento.value
                    .toLowerCase();


            const eventos =
                document.querySelectorAll(
                    ".evento"
                );


            eventos.forEach((evento) => {


                const nome =
                    evento
                        .querySelector("h2")
                        .textContent
                        .toLowerCase();


                if (nome.includes(texto)) {

                    evento.style.display =
                        "";

                }

                else {

                    evento.style.display =
                        "none";

                }

            });

        }
    );


    // ==========================================
    // BOTÃO CRIAR EVENTO
    // ==========================================

    botaoCriarEvento.addEventListener(
        "click",
        function(event) {


            event.preventDefault();


            if (usuarioAtual) {


                window.location.href =
                    "criarEvento.html";


            }

            else {


                alert(
                    "Você precisa estar logado para criar um evento."
                );


                window.location.href =
                    "login.html";

            }

        }
    );


    </script>

</body>

</html>
